<style>
:root{
  --page:#f3f2ee; --surface:#fdfdfc; --surface-2:#f1f0ec; --hover:#ecebe6; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --border:rgba(11,11,11,.11); --accent:#2a78d6; --accent-ink:#1d5fae; --accent-soft:rgba(42,120,214,.10);
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --warn-ink:#8a5a00; --crit:#d03b3b; --crit-ink:#b02a2a;
  --crit-soft:rgba(208,59,59,.10); --warn-soft:rgba(250,178,25,.17); --good-soft:rgba(12,163,12,.10);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04); --shadow-h:0 4px 16px rgba(0,0,0,.10);
  --hero1:#16345c; --hero2:#2a78d6;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --hover:#2a2a28; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --border:rgba(255,255,255,.12); --accent:#3987e5; --accent-ink:#8dbcf3; --accent-soft:rgba(57,135,229,.18);
  --good-ink:#3fc23f; --warn-ink:#fab219; --crit-ink:#f07b7b; --crit-soft:rgba(208,59,59,.18); --warn-soft:rgba(250,178,25,.13); --good-soft:rgba(12,163,12,.16);
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-h:0 4px 18px rgba(0,0,0,.5); --hero1:#0f2440; --hero2:#1d5fae;
 --h1:#050e1c;--h2:#0a2347;--h3:#164c99;}}
:root[data-theme="dark"]{
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --hover:#2a2a28; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --border:rgba(255,255,255,.12); --accent:#3987e5; --accent-ink:#8dbcf3; --accent-soft:rgba(57,135,229,.18);
  --good-ink:#3fc23f; --warn-ink:#fab219; --crit-ink:#f07b7b; --crit-soft:rgba(208,59,59,.18); --warn-soft:rgba(250,178,25,.13); --good-soft:rgba(12,163,12,.16);
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-h:0 4px 18px rgba(0,0,0,.5); --hero1:#0f2440; --hero2:#1d5fae;
 --h1:#050e1c;--h2:#0a2347;--h3:#164c99;}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:0 16px 60px}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:550;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;transition:background .12s}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.danger{color:var(--crit-ink)}
.btn.onhero{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.btn.onhero:hover{background:rgba(255,255,255,.22)}
.btn.onhero.pri{background:#fff;color:#16345c;border-color:#fff}
/* hero */
.hero{background:linear-gradient(120deg,var(--hero1),var(--hero2));color:#fff;margin:0 -16px 16px;padding:22px 32px 70px;border-radius:0 0 22px 22px}
.hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.hero h1{font-size:23px;margin:0;letter-spacing:-.01em}
.hero .sub{opacity:.85;font-size:13px;margin-top:2px}
.hero .tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.save{font-size:12px;opacity:.85;margin-right:6px}
.save.bad{color:#ffd166;opacity:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin:-58px 0 14px;position:relative}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.kpi .ic{grid-row:span 2;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.kpi .v{font-size:26px;font-weight:720;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--ink-2);line-height:1.25}
h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2 .cnt{font-weight:500}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.cnt{font-size:12px;color:var(--muted)}
/* agenda */
.agenda{margin-bottom:12px}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(52px,1fr);gap:5px;overflow-x:auto;padding-bottom:4px}
.day{border:1px solid var(--border);border-radius:10px;padding:6px 4px;text-align:center;cursor:pointer;background:var(--surface-2);min-height:78px;display:flex;flex-direction:column;gap:3px;align-items:center;transition:background .1s}
.day:hover{background:var(--hover)}
.day.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);background:var(--surface)}
.day.wk{opacity:.65}
.day.today .dn{background:var(--accent);color:#fff;border-radius:6px;padding:0 5px}
.day .dw{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:650}
.day .dn{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.day .dots{display:flex;flex-direction:column;gap:2px;width:100%;align-items:center}
.dtag{font-size:10px;font-weight:700;border-radius:5px;padding:0 5px;line-height:15px}
.dtag.rv{background:var(--crit-soft);color:var(--crit-ink)} .dtag.aj{background:var(--accent-soft);color:var(--accent-ink)} .dtag.tf{background:var(--warn-soft);color:var(--warn-ink)}
.day.late{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.daylist{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px}
.legendline{display:flex;gap:12px;font-size:11.5px;color:var(--ink-2);align-items:center;margin-left:auto;font-weight:400}
.panels{display:grid;grid-template-columns:1.1fr 1.1fr 1fr;gap:12px;margin-bottom:16px}
@media (max-width:1050px){.panels{grid-template-columns:1fr}}
.alist{display:flex;flex-direction:column;gap:5px;max-height:268px;overflow:auto}
.aitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:9px;background:var(--surface-2);cursor:pointer;border:1px solid transparent;border-left:4px solid var(--gc,transparent)}
.aitem:hover{border-color:var(--accent);border-left-color:var(--gc,var(--accent))}
.aitem .t1{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;font-weight:750}
.aitem .t2{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;text-align:center;min-width:66px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.venc{background:var(--crit);color:#fff} .pill.lar{background:#eb6834;color:#fff} .pill.ama{background:#fab219;color:#241a00} .pill.prox{background:var(--warn-soft);color:var(--warn-ink)} .pill.ok{background:var(--good-soft);color:var(--good-ink)}
.pill.hoje{background:var(--crit);color:#fff} .pill.aij{background:var(--accent-soft);color:var(--accent-ink)} .pill.real{background:var(--good-soft);color:var(--good-ink)} .pill.tf{background:var(--warn-soft);color:var(--warn-ink)}
.lg{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;font-size:12.5px;cursor:pointer;padding:4px 6px;border-radius:7px}
.lg:hover{background:var(--hover)} .lg.on{background:var(--accent-soft);font-weight:650}
.lg .sw{width:14px;height:14px;border-radius:4px}
.lg .bar{height:9px;border-radius:0 4px 4px 0;margin-top:3px}
.lg .n{font-variant-numeric:tabular-nums;font-weight:700}
.tk{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.tk input[type=checkbox]{width:17px;height:17px;accent-color:var(--good);cursor:pointer}
/* tabs */
.tabsrow{display:flex;flex-wrap:wrap;gap:4px 22px;align-items:flex-end;border-bottom:1px solid var(--grid);margin:4px 0 12px}
.tgroup{display:flex;flex-direction:column}
.tgl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding-left:12px}
.tabs{display:flex;flex-wrap:wrap}
.tab{background:none;border:0;padding:8px 12px;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px;font-size:14px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-color:var(--accent);font-weight:700}
.tab .c{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--surface-2);font-size:11px;text-align:center;font-weight:650}
.tab.on .c{background:var(--accent);color:#fff}
.tgroup.enc .tab{font-size:13px} .tgroup.enc .tab.on{border-color:var(--muted)} .tgroup.enc .tab.on .c{background:var(--muted)}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;align-items:center}
select,input,textarea{font:inherit;color:var(--ink)}
.filters input,.filters select{font-size:13px;padding:6px 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.filters select.act{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.filters input[type=search]{flex:1 1 260px}
.flabel{font-size:11.5px;color:var(--muted);margin-right:-4px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-size:12.5px;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--page);font-weight:650}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:9px;padding:8px 12px;margin-bottom:10px}
.ghdr{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-weight:700;font-size:14px}
.ghdr .sw{width:14px;height:14px;border-radius:4px}
/* chips */
.chip{--c:#898781;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:3px 9px 3px 7px;border-radius:20px;white-space:nowrap;
  background:color-mix(in srgb,var(--c) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 50%,transparent);color:var(--ink);line-height:1.3}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.chip .k{font-weight:500;color:var(--ink-2);font-size:10.5px}
.chip.vazio{--c:#b5b3ac;border-style:dashed;background:transparent;color:var(--muted)}
button.chip{cursor:pointer} button.chip:hover{background:color-mix(in srgb,var(--c) 26%,var(--surface))}
.tag{--c:#898781;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:6px;background:var(--c);color:var(--on,#fff);white-space:nowrap}
.tag.x button{border:0;background:none;color:inherit;padding:0 0 0 3px;font-size:13px;line-height:1;opacity:.8}
.crime{--c:#898781;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:750;padding:4px 10px;border-radius:7px;background:var(--c);color:var(--on,#fff);letter-spacing:.01em}
.crime.x button{border:0;background:none;color:inherit;padding:0 0 0 2px;font-size:14px;line-height:1;opacity:.85}
.addbtn{font-size:11.5px;border:1px dashed var(--border);background:none;border-radius:6px;padding:2px 8px;color:var(--ink-2)}
.addbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
/* process card */
.cards{display:grid;grid-template-columns:1fr;gap:12px}
.pbody{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:4px 22px}
@media (max-width:860px){.pbody{grid-template-columns:1fr}}
.pcolR{display:flex;flex-direction:column}
.pcolR .dilbox{flex:1;display:flex;flex-direction:column}
.pcolR .dilbox textarea{flex:1}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:750;padding:3px 9px;border-radius:7px;border:2px solid var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.triagem{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.triagem .tb{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:650;padding:5px 11px;border-radius:9px;border:2px solid var(--c);background:var(--surface);cursor:pointer}
.triagem .tb .n{background:var(--c);color:var(--on,#fff);border-radius:10px;padding:0 7px;font-size:11px}
.triagem .tb.on{background:color-mix(in srgb,var(--c) 18%,var(--surface));box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 40%,transparent)}
.dilres{font-size:12px;color:var(--ink-2);max-width:340px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.dtabs{display:flex;gap:4px;margin-top:12px}
.dtab{border:0;background:color-mix(in srgb,var(--surface) 55%,transparent);padding:7px 14px;border-radius:9px 9px 0 0;font-weight:650;font-size:13px;color:var(--ink-2)}
.dtab.on{background:var(--page);color:var(--ink)}
.revhero{border-radius:12px;padding:8px 14px;text-align:center;min-width:170px}
.revhero .big{font-size:24px;font-weight:850;line-height:1.1}
.revhero .s{font-size:12px;font-weight:650}
.revhero.venc{background:var(--crit);color:#fff}.revhero.lar{background:#eb6834;color:#fff}.revhero.ama{background:#fab219;color:#241a00}.revhero.ok{background:var(--good-soft);color:var(--good-ink);border:1px solid color-mix(in srgb,var(--good) 40%,transparent)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.minuta textarea{min-height:420px!important;font-family:"Times New Roman",Georgia,serif;font-size:15px!important;line-height:1.6!important;background:#fff!important;color:#111!important}
.cfgtabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--grid);margin-bottom:12px}
.cfgtabs button{border:0;background:none;padding:7px 12px;border-bottom:3px solid transparent;color:var(--ink-2);font-weight:600}
.cfgtabs button.on{border-color:var(--accent);color:var(--ink)}
.numrow{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;margin-bottom:8px}
.numrow input{text-align:center}
.ph{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;background:var(--surface-2);border-radius:5px;padding:1px 5px;cursor:pointer}
.ph:hover{background:var(--accent-soft)}
.proc{--gc:#898781;position:relative;padding:0;overflow:hidden;border-left:8px solid var(--gc);transition:box-shadow .15s}

/* compact list */

.ibtn.ativo{background:#fff;color:var(--h2)}
.navp{display:inline-flex;gap:6px;align-items:center}

.cm-b{font-size:10px;color:var(--muted);font-style:italic}

function grupoAuto(c){
  const t=norm(c);
  if(/TRAFICO|DROGA|ENTORPEC/.test(t)) return 'trafico';
  if(/LATROCIN/.test(t)) return 'patrimonio';
  if(/FEMINIC|HOMICID|ABORTO|SUICID|INFANTICID/.test(t)) return /VEICULO|TRANSITO|CTB/.test(t)?'transito':'vida';
  if(/ESTUPRO|SEXUAL|IMPORTUNA|LIBIDIN|VULNERAVEL|PORNOGRAF|LASCIVIA/.test(t)) return 'sexual';
  if(/VIOLENCIA DOM|MARIA DA PENHA|MEDIDA PROTETIVA|PERSEGUI|PSICOLOG/.test(t)) return 'vd';
  if(/ARMA DE FOGO|MUNIC|DISPARO/.test(t)) return 'armas';
  if(/ROUBO|FURTO|EXTORS|RECEPTA|ESTELION|DANO|APROPRIA|FRAUDE/.test(t)) return 'patrimonio';
  if(/VOLANTE|HABILITA|CTB|TRANSITO|VEICULO|RACHA/.test(t)) return 'transito';
  if(/AMBIENT|FAUNA|FLORA|FLORESTA|PESCA|ANIMA|POLUI/.test(t)) return 'ambiental';
  if(/DESACATO|RESISTENC|DESOBED|CORRUPC|PECULAT|FALS|DOCUMENTO/.test(t)) return 'adm';
  if(/AMEACA|LESAO|INJURIA|CALUNIA|DIFAMA|VIAS DE FATO|PERTURBA|CONSTRANG/.test(t)) return 'menor';
  return 'outros';
}

/* ---------- cálculo do tempo (mesma lógica das versões anteriores) ---------- */
function arred5(k){ const resto=k%10, base=Math.floor(k/10)*10; const r=resto<=2?base:resto<=7?base+5:base+10; return Math.max(5,r); }
function calcular(r){
  const T=tipoDe(r.tipo), A=AJ(), mem=[];
  const crimes=(r.crimes||[]).map(crimeInfo).sort((a,b)=>b.pts-a.pts);
  const crimePts=crimes.length?crimes[0].pts+(crimes.length-1)*A.p.crimeExtra:0;
  const nR=+r.nReus||0, nV=+r.nVitimas||0, nT=+r.nTestemunhas||0;
  const hDef=T.calc==='pontos'||T.crimes?(r.defesa==='Constituída'?A.p.defC:r.defesa==='Nomeada'?A.p.defN:r.defesa==='Defensoria'?A.p.defD:0):0;
  const hPartes=nR*A.p.reu+nV*A.p.vit+nT*A.p.tes, hPreso=(T.preso&&r.preso)?A.p.preso:0;
  const H=hDef+hPartes+hPreso+crimePts;
  let nivel, base, kBruto;
  const extra=parseInt(r.extra)||0;
  if(T.calc==='pontos'){
    if(H>A.f.mc){nivel='mc';base=A.t.mc;} else if(H>=A.f.c){nivel='c';base=A.t.c;} else if(H>=A.f.m){nivel='m';base=A.t.m;} else {nivel='s';base=A.t.s;}
    const kP=nR*A.t.kReu+nV*A.t.kVit+nT*A.t.kTes, kD=r.defesa==='Constituída'?A.t.bonusC:0, kPr=(T.preso&&r.preso)?A.t.bonusP:0;
    kBruto=base+kP+kD+kPr+extra+A.t.fixo+(T.ajuste||0);
    mem.push(`<b>1. Pontos de complexidade:</b> defesa (${hDef}) + partes (${hPartes.toFixed(1)}) + réu preso (${hPreso}) + tipo(s) penal(is) (${crimePts}${crimes.length>1?` = ${crimes[0].pts} do principal + ${crimes.length-1}×${A.p.crimeExtra}`:''}) = <b>${H.toFixed(1)} pts</b>`);
    mem.push(`<b>2. Faixa:</b> ${NIVEL[nivel]} → tempo base de <b>${base} min</b>`);
    mem.push(`<b>3. Tempo bruto:</b> base (${base}) + oitivas (${kP}) + defesa constituída (${kD}) + réu preso (${kPr}) + tempo extra (${extra>=0?'+':''}${extra}) + constante (${A.t.fixo})${T.ajuste?` + ajuste do tipo (${T.ajuste>0?'+':''}${T.ajuste})`:''} = <b>${kBruto} min</b>`);
  } else {
    const kc=T.cont.map(([k,l,m])=>({l,n:+r[k]||0,m:+m||0}));
    const kP=kc.reduce((s,x)=>s+x.n*x.m,0);
    kBruto=T.base+kP+extra;
    nivel=crimes.length&&T.crimes?(H>A.f.mc?'mc':H>=A.f.c?'c':H>=A.f.m?'m':'s'):(kBruto<=20?'s':kBruto<=40?'m':kBruto<=70?'c':'mc');
    mem.push(`<b>1. Tempo base do tipo “${esc(T.nome)}”:</b> ${T.base} min`);
    mem.push(`<b>2. Pessoas:</b> ${kc.map(x=>`${x.n} × ${x.m} min (${esc(x.l.toLowerCase())})`).join(' + ')||'—'} = <b>${kP} min</b>`);
    mem.push(`<b>3. Tempo bruto:</b> ${T.base} + ${kP} + tempo extra (${extra>=0?'+':''}${extra}) = <b>${kBruto} min</b>`);
    mem.push(`<b>Complexidade:</b> ${NIVEL[nivel]}${crimes.length&&T.crimes?` (${H.toFixed(1)} pts)`:' (pela duração)'}`);
  }
  if(kBruto<5) kBruto=5;
  const K=arred5(kBruto);
  mem.push(`<b>${T.calc==='pontos'?'4':'4'}. Arredondamento:</b> múltiplo de 5 (finais 0–2 descem, 3–7 fixam no 5, 8–9 sobem) → <b>${K} min</b>`);
  return {H,nivel,base,kBruto,K,mem,crimePts};
}

  let h=`<div class="note">${ico('check',14)} Cumprimento das audiências designadas — substitui o arquivo do Drive. Cada audiência tem checklist, partes, advogados, IDs das peças e fatos. Gere o documento do dia no mesmo formato usado hoje.</div>
    <div class="filters"><span class="flabel">Período</span><span class="seg">${['3','7','15','30'].map(k=>`<button data-cd="${k}" class="${String(nd)===k?'on':''}">${k} dias</button>`).join('')}</span>

      ${l.map(r=>{ const hh=H.map[r.id], c=chkInfo(r), falta=chkItens(r).filter(it=>!(r.check||{})[it.id]);
        return `<div class="aitem" data-go="${r.id}" data-tab="cump" style="--gc:${tipoDe(r.tipo).cor};grid-template-columns:70px minmax(0,1fr) auto;margin-bottom:5px">

          <div style="min-width:0"><div class="t1">${esc(r.proc||'(sem número)')} <span class="cnt" style="font-family:system-ui">${esc(tipoDe(r.tipo).sigla)}${nomesPrinc(r)?' · '+esc(trunc(nomesPrinc(r),50)):''}</span></div>

/* ---------- menus ---------- */
let menuEl=null;
function fecharMenu(){ if(menuEl){ menuEl.remove(); menuEl=null; } }
document.addEventListener('mousedown',e=>{ if(menuEl&&!menuEl.contains(e.target)) setTimeout(()=>{ if(menuEl&&!menuEl.contains(document.activeElement)) fecharMenu(); },0); });
function abrirMenu(btn,html){
  fecharMenu(); menuEl=document.createElement('div'); menuEl.className='menu'; menuEl.innerHTML=html; document.body.appendChild(menuEl);
  const b=btn.getBoundingClientRect(), w=menuEl.offsetWidth, hg=menuEl.offsetHeight;
  let left=Math.min(b.left,window.innerWidth-w-10); if(left<8) left=8; let top=b.bottom+4; if(top+hg>window.innerHeight-8) top=Math.max(8,b.top-hg-4);
  menuEl.style.position='fixed'; menuEl.style.left=left+'px'; menuEl.style.top=top+'px'; return menuEl;
}
function menuResultado(btn,r){
  const m=abrirMenu(btn,`<div class="mh">Resultado da audiência</div>${Object.entries(RESULTADOS).map(([k,v])=>`<button data-r="${k}" class="${r.resultado===k?'sel':''}"><span class="dot" style="background:${v[1]}"></span>${v[0]}${k==='redesignada'?' (escolher nova data)':''}</button>`).join('')}${r.resultado?'<hr><button data-r="">Limpar resultado</button>':''}`);

}
function registrarResultado(r,res){
  if(res==='redesignada'){ dialogoDesignar([r],'redesignar'); return; }
  if(!res){ r.resultado=''; salvar(); renderTudo(); return; }
  pedir(`${RESULTADOS[res][0]} — observação`,'Opcional: o que ocorreu, motivo, deliberações.',false,r.resultadoObs||'').then(v=>{ if(v===null) return;
    r.resultado=res; r.resultadoObs=v.v||''; r.hist.push({em:new Date().toISOString(),data:r.data,res,obs:r.resultadoObs}); logar(r,'Resultado: '+RESULTADOS[res][0],r.resultadoObs); salvar(); renderTudo(); toast(`Marcada como ${RESULTADOS[res][0].toLowerCase()}.`,true); });

function menuMais(btn,r){

  m.onclick=e=>{ const b=e.target.closest('[data-x]'); if(!b) return; const x=b.dataset.x; if(x!=='etq') fecharMenu();

   ===================================================================== */
function campoHTML(c,v){
  const val=v??'', full=c.full?'full':'';
  let inp;
  if(c.t==='select') inp=`<select data-c="${c.k}">${c.o.map(o=>`<option value="${esc(o)}" ${String(val)===o?'selected':''}>${o||'—'}</option>`).join('')}</select>`;
  else if(c.t==='textarea') inp=`<textarea data-c="${c.k}" placeholder="${esc(c.ph||'')}" style="min-height:62px">${esc(val)}</textarea>`;
  else inp=`<input type="${c.t==='date'?'date':c.t==='number'?'number':'text'}" data-c="${c.k}" value="${esc(val)}" placeholder="${esc(c.ph||'')}">`;
  return `<div class="fld ${full}"><label>${esc(c.l)}</label>${inp}${c.hint?`<span class="hint">${esc(c.hint)}</span>`:''}</div>`;
}
function stepper(k,v,min,step){ return `<div class="stepper"><button type="button" data-step="${k}" data-d="-${step||1}">−</button><input type="number" data-f="${k}" value="${v}" ${min!=null?`min="${min}"`:''} step="${step||1}"><button type="button" data-step="${k}" data-d="${step||1}">+</button></div>`; }
function calcBoxHTML(r){
  const c=calcular(r);

/* relevância: artigo exato > nome começando com o texto > palavra começando > contém > artigo/grupo */
function scoreCrime(t,nq,qd){
  if(!nq) return 0;
  const nv=norm(t.v), na=norm(t.art);
  if(qd){ const arts=[...na.matchAll(/(\d+(?:-[A-Z])?)/g)].map(x=>x[1]);
    if(arts[0]===qd) return /CAPUT/.test(na)||!/§|INC|PARAG/.test(na)?0:1;
    if(arts.includes(qd)) return 2; }
  if(nv.startsWith(nq)) return 1;
  if(nv.split(/[\s–\-\/(),]+/).some(w=>w.startsWith(nq))) return 2;
  if(nv.includes(nq)) return 3;
  const ws=nq.split(' ').filter(Boolean); if(ws.length>1&&ws.every(w=>(nv+' '+na).includes(w))) return 3;
  if(na.includes(nq)||norm(GMAP[t.g].nome).includes(nq)) return 4;
  return 99;
}
const SINON_CRIME=[[/MARIA DA PENHA|LEI 11\.?340|\bVD\b|VIOLENCIA DOMESTICA/,/VIOLENCIA DOMESTICA|11\.340/],[/^CTB$|TRANSITO/,/\bCTB\b|VOLANTE|VEICULO/],[/^ECA$/,/\bECA\b/],[/^DROGAS?$|ENTORPECENTE/,/11\.343/],[/DESARMAMENTO|^ARMAS?$/,/10\.826|\bARMA/]];
function buscaCrimes(q,lim){ const nq=norm(q).trim(); const sn=SINON_CRIME.find(([re])=>re.test(nq));
  if(sn) return todosCrimes().filter(t=>sn[1].test(norm(t.v+' '+t.art))).sort((a,b)=>a.v.length-b.v.length).slice(0,lim||40);
  const  m=nq.match(/\d+(?:-[A-Z])?/), qd=m?m[0]:'';
  return todosCrimes().map(t=>({t,s:scoreCrime(t,nq,qd)})).filter(x=>x.s<99).sort((a,b)=>a.s-b.s||a.t.v.length-b.t.v.length||a.t.v.localeCompare(b.t.v)).slice(0,lim||40).map(x=>x.t); }
const CRIMES_FREQ=['TRÁFICO DE DROGAS','LESÃO CORPORAL – VIOLÊNCIA DOMÉSTICA','AMEAÇA – VIOLÊNCIA DOMÉSTICA','DESCUMPRIMENTO DE MEDIDA PROTETIVA','ROUBO','FURTO','FURTO QUALIFICADO','RECEPTAÇÃO','PORTE ILEGAL DE ARMA DE FOGO DE USO PERMITIDO','POSSE IRREGULAR DE ARMA DE FOGO DE USO PERMITIDO','HOMICÍDIO QUALIFICADO','HOMICÍDIO TENTADO','ESTUPRO DE VULNERÁVEL','EMBRIAGUEZ AO VOLANTE','ESTELIONATO'];
function crimeRow(t,r,i){ const g=GMAP[t.g]||GMAP.outros; return `<button type="button" data-crime="${esc(t.v)}" class="crrow ${r.crimes.includes(t.v)?'on':''} ${i===0?'hl':''}"><span class="crn"><i style="background:${g.cor}"></i>${esc(t.v)}</span><span class="art">${esc(t.art||g.nome)}</span></button>`; }
function listaCrimes(r,box){
  const q=box.querySelector('#crQ'), L=box.querySelector('#crL'); if(!q||!L) return;
  const txt=q.value.trim();
  let h='';
  if(!txt){ const usados={}; DB.registros.forEach(x=>x.crimes.forEach(c=>usados[c]=(usados[c]||0)+1));
    let freq=Object.keys(usados).sort((a,b)=>usados[b]-usados[a]); CRIMES_FREQ.forEach(c=>{ if(!freq.includes(c)) freq.push(c); });
    const l=freq.slice(0,14).map(crimeInfo);
    h=`<div class="gh">${Object.keys(usados).length?'Mais usados':'Mais comuns'} — ou digite para buscar entre ${todosCrimes().length} tipos</div>`+l.map((t,i)=>crimeRow(t,r,-1)).join('');
  } else {
    const l=buscaCrimes(txt,40);
    h=l.length?l.map((t,i)=>crimeRow(t,r,i)).join(''):`<div class="cnt" style="padding:10px">Nada encontrado para “${esc(txt)}”.</div>`;
    if(!l.some(t=>norm(t.v)===norm(txt))) h+=`<div class="crnovo"><span>Não encontrou? Incluir <b>“${esc(txt.toUpperCase())}”</b> no grupo</span><select id="crNovoG">${GRUPOS.map(g=>`<option value="${g.id}" ${grupoAuto(txt)===g.id?'selected':''}>${esc(g.nome)}</option>`).join('')}</select><button type="button" class="btn sm" data-crnovo="1">＋ Incluir</button></div>`;
  }
  L.innerHTML=h; L.scrollTop=0;
}

  </div></div>

function ligarForm(box,r,aoMudar){
  const recalc=()=>{ recalcular(r); const cb=box.querySelector('#calcBox'); if(cb) cb.innerHTML=calcBoxHTML(r); if(aoMudar) aoMudar(); };
  box.addEventListener('input',e=>{ const t=e.target;
    if(t.id==='crQ'){ listaCrimes(r,box); return; }
    if(t.dataset.f){ const k=t.dataset.f; let v=t.value;
      if(['nReus','nVitimas','nTestemunhas','extra'].includes(k)) v=k==='extra'?(parseInt(v)||0):Math.max(0,parseInt(v)||0);
      if(k==='preso') v=v==='1';
      if(k==='tipo') return;
      r[k]=v; if(['nReus','nVitimas','nTestemunhas','extra','defesa','preso'].includes(k)) recalc(); else if(aoMudar) aoMudar(); }
    if(t.dataset.c){ r.campos[t.dataset.c]=t.value; if(aoMudar) aoMudar(); }
  });
  box.addEventListener('change',e=>{ const t=e.target;
    if(t.dataset.f==='tipo'){ r.tipo=t.value; r.Kman=false; recalcular(r); if(aoMudar) aoMudar(true); return; }
    if(t.dataset.f==='proc'){ t.value=formatarCNJ(t.value); r.proc=t.value; if(aoMudar) aoMudar(); }
    if(t.dataset.f==='preso'||t.dataset.f==='defesa'){ r[t.dataset.f]=t.dataset.f==='preso'?t.value==='1':t.value; recalc(); }
  });
  box.addEventListener('click',e=>{
    const st=e.target.closest('[data-step]'); if(st){ const k=st.dataset.step, inp=box.querySelector(`[data-f="${k}"]`); let v=(parseInt(inp.value)||0)+parseInt(st.dataset.d); if(k!=='extra') v=Math.max(0,v); inp.value=v; r[k]=v; recalc(); return; }
    const cr=e.target.closest('[data-crime]'); if(cr){ const v=cr.dataset.crime; r.crimes=r.crimes.includes(v)?r.crimes.filter(x=>x!==v):[...r.crimes,v]; box.querySelector('#crSel').innerHTML=crimesSelHTML(r); const q=box.querySelector('#crQ'); if(q.value&&!r.crimes.includes(v)===false){ q.value=''; } listaCrimes(r,box); q.focus(); recalc(); return; }
    const rm=e.target.closest('[data-a=rmcrime]'); if(rm){ e.stopPropagation(); r.crimes=r.crimes.filter(x=>x!==rm.dataset.v); box.querySelector('#crSel').innerHTML=crimesSelHTML(r); listaCrimes(r,box); recalc(); return; }
    const ng=e.target.closest('[data-crnovo]'); if(ng){ const q=box.querySelector('#crQ'), v=q.value.trim().toUpperCase(); if(!v) return; const g=box.querySelector('#crNovoG').value; DB.config.crimesExtra.push({v,g,art:'',pts:10}); r.crimes.push(v); q.value=''; box.querySelector('#crSel').innerHTML=crimesSelHTML(r); listaCrimes(r,box); recalc(); toast(`“${v}” incluído no banco de tipos penais (peso 10 — ajuste em Ajustes → Tipos penais).`); return; }
    const x=e.target.closest('[data-x]'); if(!x) return;
    if(x.dataset.x==='memo'){ const m=box.querySelector('#memoBox'); if(m) m.classList.toggle('hidden'); }
    if(x.dataset.x==='usarCalc'){ r.Kman=false; recalc(); }
  });
  const q=box.querySelector('#crQ'); if(q){ listaCrimes(r,box); q.onkeydown=e=>{ const its=[...box.querySelectorAll('#crL [data-crime]')]; let i=its.findIndex(x=>x.classList.contains('hl'));
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(i>=0) its[i].classList.remove('hl'); i=e.key==='ArrowDown'?Math.min(its.length-1,i+1):Math.max(0,i-1); if(its[i]){ its[i].classList.add('hl'); its[i].scrollIntoView({block:'nearest'}); } }
    if(e.key==='Enter'){ e.preventDefault(); const b=its[i>=0?i:0]; if(b&&q.value.trim()) b.click(); } }; }
}

function ligarCump(body,r){

/* ---------- organizar pauta a partir do banco ----------
   O usuário filtra os processos do banco (ano, crime, defesa, tipo…), informa a(s) data(s)
   e a regra de ordem; o painel monta a pauta só com eles, sem nenhuma audiência começar
   depois do horário limite do dia (terminar depois pode). */
function prioridade(r){ let s=0; if(r.prioridade) s+=1000; if(r.preso&&tipoDe(r.tipo).preso) s+=500; if(r.campos&&r.campos.internacao) s+=800+Math.round((HOJE-parse(r.campos.internacao))/DIA);
  if(r.criadoEm) s+=Math.min(300,Math.round((Date.now()-Date.parse(r.criadoEm))/DIA)); return s; }
function grupoPrinc(r){ if(!r.crimes||!r.crimes.length) return 'outros'; const c=r.crimes.map(crimeInfo).sort((a,b)=>b.pts-a.pts)[0]; return c.g||'outros'; }
const ehPreso=r=>!!(r.preso&&tipoDe(r.tipo).preso);
const anoProc=r=>{ const m=String(r.proc||'').match(/^\d{7}-\d{2}\.(\d{4})\./); return m?m[1]:'s/n'; };
const defProc=r=>{ const t=defesaTxt(r); return t||'Não informada'; };
/* simula os horários do dia; regra: '' = como o painel ordenaria, 'manter' = existentes e depois as novas */
function simularDia(d,novos,regra){
  const ex=diaLista(d).filter(r=>r.resultado!=='cancelada'), lim=toMin(fimDia(d)), iv=+AJ().intervalo||0;
  let l=[...ex,...novos];
  if(regra&&regra!=='manter') l=ordenarLista(l.slice(),regra);
  else if(!regra&&AJ().ordem!=='ordem_lancamento'&&!DB.ordemManual[d]) l=ordenarLista(l.slice());
  let t=toMin(inicioDia(d)); const rows=l.map(x=>{ if(x.horaFixa){ const hf=toMin(x.horaFixa); if(hf>t) t=hf; } const o={x,ini:t,novo:novos.includes(x),exc:t>lim}; t+=(+x.K||0)+iv; return o; });
  return {rows,lim,prox:t};
}
function diaFechado(d){ const l=diaLista(d).filter(r=>r.resultado!=='cancelada'); if(!l.length) return false; const s=simularDia(d,[]); return s.prox>s.lim||s.rows.some(o=>o.exc); }
function proxDiaPauta(apos){ let d=addDias(apos||hojeISO(),1); for(let i=0;i<120;i++,d=addDias(d,1)) if(ehDiaPauta(d)) return d; return addDias(apos||hojeISO(),1); }
const REGRAS_ORDEM=[['simples_complexa','Da mais simples para a mais complexa'],['complexa_simples','Da mais complexa para a mais simples'],['presos_primeiro','Réus presos primeiro'],['agrupar_crime','Agrupar por crime'],['agrupar_tipo','Agrupar por tipo de audiência'],['mais_antigas','Mais antigas no banco primeiro']];
const PREF_SOBRA=[['antigas','as mais antigas no banco (e as marcadas como prioridade)'],['simples','as mais simples (cabe mais audiências no dia)'],['presos','réus presos primeiro']];
let OP={f:{ano:[],grupo:[],crime:'',defesa:[],tipo:[],preso:'',nivel:[],etq:[],q:''},fora:new Set(),dias:[],regra:'simples_complexa',pref:'antigas',plano:null,excl:new Set(),sobra:[]};
const SG=OP;
function opBanco(){ return DB.registros.filter(r=>!r.resultado&&!r.data); }
function opFiltrar(){
  const f=OP.f, q=norm(f.q);
  return opBanco().filter(r=>(!f.ano.length||f.ano.includes(anoProc(r)))&&(!f.grupo.length||f.grupo.includes(grupoPrinc(r)))&&(!f.crime||r.crimes.includes(f.crime))
    &&(!f.defesa.length||f.defesa.includes(defProc(r)))&&(!f.tipo.length||f.tipo.includes(r.tipo))&&(!f.preso||(f.preso==='p'?ehPreso(r):!ehPreso(r)))
    &&(!f.nivel.length||f.nivel.includes(r.nivel||'s'))&&(!f.etq.length||f.etq.some(e=>r.etiquetas.includes(e)))
    &&(!q||norm([r.proc,nomesPrinc(r),r.crimes.join(' '),r.obs].join(' ')).includes(q)));
}
function opSelecionados(){ return opFiltrar().filter(r=>!OP.fora.has(r.id)); }
function opMontar(){
  const pref=OP.pref, ant=r=>String(r.criadoEm||'');
  let pool=opSelecionados().slice();
  if(pref==='simples') pool.sort((a,b)=>(a.H||0)-(b.H||0)||(+a.K||0)-(+b.K||0));
  else if(pref==='presos') pool.sort((a,b)=>(ehPreso(b)-ehPreso(a))||(!!b.prioridade-!!a.prioridade)||ant(a).localeCompare(ant(b)));
  else pool.sort((a,b)=>(!!b.prioridade-!!a.prioridade)||ant(a).localeCompare(ant(b)));
  const plano=[];
  [...new Set(OP.dias.filter(Boolean))].sort().forEach(d=>{
    const base=simularDia(d,[],OP.regra), excAntes=new Set(base.rows.filter(o=>o.exc).map(o=>o.x.id)), novos=[];
    for(const r of [...pool]){
      const s=simularDia(d,[...novos,r],OP.regra);
      if(s.rows.every(o=>!o.exc||(!o.novo&&excAntes.has(o.x.id)))) novos.push(r);
      if(simularDia(d,novos,OP.regra).prox>toMin(fimDia(d))) break;
    }
    pool=pool.filter(r=>!novos.includes(r));
    plano.push({d,itens:novos});
  });
  OP.plano=plano; OP.sobra=pool; OP.excl=new Set();
}

const SEP='<p><b>_____________________________________________________________________</b></p>';
const idTxt=v=>{ v=String(v||'').trim(); return !v?'':/^(id|expediente|conforme)/i.test(v)?v:'ID: '+v; };
function blocoCumprimento(r,pos,hora){
  const T=tipoDe(r.tipo), c=r.cump, cp=r.campos, ch=r.check||{}, its=chkItens(r);
  const est=re=>{ const it=its.find(x=>re.test(x.nome)); return it?ch[it.id]:'x'; };
  const P=[], L=s=>P.push(`<p>${s}</p>`);
  const assunto=cp.assuntos||r.crimes.join(' - ');
  L(`<b>${pos}ª - ${hora} - ${esc(r.proc||'(sem número)')}</b>${cp.classe?` - <mark>${esc(cp.classe)}</mark>`:''}${assunto?` - <mark>${esc(assunto)}</mark>`:''}${cp.bu||cp.tco?` - <b>BU ${esc(cp.bu||cp.tco)}.</b>`:''}`);
  if(!cp.classe&&T.id!=='aij'&&T.id!=='aij_cont') L(`<b>${esc(T.nome.toUpperCase())}</b>`);
  if(r.resultado==='cancelada') L(`<b style="color:#c00000">AUDIÊNCIA CANCELADA</b>${r.resultadoObs?' - '+esc(r.resultadoObs):''}`);
  const reg=est(/registrada/i), tax=est(/taxonomia/i);
  if(reg!=='x') L(reg==='ok'?'Audiência registrada no PJE.':'<b style="color:#c00000">AUDIÊNCIA PARA REGISTRAR</b>');
  if(tax!=='x') L(tax==='ok'?'Taxonomia conferida e correta.':'<b>TAXONOMIA</b> - <span style="color:#c00000">pendente de conferência</span>');
  L(`<b>Ministério Público</b> ${c.mp?esc(c.mp).replace(/^-\s*/,''):'- <span style="color:#c00000">PENDENTE</span>'}${c.mp&&!/[.!]$/.test(c.mp)?'.':''}`);
  const ref=p=>(p.reforcos||[]).forEach(f=>L(`<b>→ ${esc(f.txt)}</b>`));
  principais(r).forEach(p=>{
    if(p.preso){ L(`<b>${esc(p.papel==='Adolescente'?'ADOLESCENTE INTERNADO':'RÉU PRESO')}${p.unidade?' '+esc(p.unidade):''}:</b> ${esc(p.nome)}`);
      if(p.reqId) L(`Requisitado ${esc(idTxt(p.reqId))}.`); if(p.confId) L(`Confirmação de requisição ${esc(idTxt(p.confId))}.`); }
    else L(`<b>${esc(p.papel)}:</b> ${esc(p.nome)}${p.tel?' - '+esc(p.tel):''}${p.end?' - '+esc(p.end):''}${p.status?' - '+esc(p.status):''}`);
    if(p.citado) L(`Citado em ${esc(idTxt(p.citado))}.`);
    if(p.preso&&p.status) L(esc(p.status)); ref(p);
  });
  r.advs.forEach(a=>{ const rot=a.tipo==='Defensoria Pública'?'Defensoria Pública':`Advogado${/a$/i.test((a.nome||'').split(' ')[0])?'a':''} ${a.tipo==='Constituído'?'constituído':'nomeado'}`;
    L(`<b>${rot}${a.papel!=='Defesa'?' ('+esc(a.papel.toLowerCase())+')':''}${a.deQuem?' de '+esc(a.deQuem):''}:</b> ${esc(a.nome)}${a.oab?' - '+esc(a.oab):''}${a.tel?' - '+esc(a.tel):''}${a.status?': '+esc(a.status):''}${/[.!]$/.test(a.status||'')?'':'.'}`); });
  const outros=r.pessoas.filter(p=>!PAPEL_PRINC.includes(p.papel)), crim=T.crimes;
  if(outros.length||c.rolMP||c.rolDef){
    if(crim) L('<b>ROL DE TESTEMUNHAS:</b>'); else L('<b>DEMAIS PARTICIPANTES:</b>');
    if(c.rolMP) L(`<b>Testemunhas arroladas pelo MP ${esc(idTxt(c.rolMP))}.</b>`);
    if(c.rolDef==='mesmas') P.push(`<ul><li>A defesa arrolou as mesmas testemunhas que o MP${c.rolDefId?', '+esc(idTxt(c.rolDefId)):''}.</li></ul>`);
    const pes=(p,n)=>{ L(`<b>${n}. ${p.papel==='Vítima'?'VÍTIMA: ':p.papel!=='Testemunha'?esc(p.papel.toUpperCase())+': ':''}${p.cargo?esc(p.cargo)+' ':''}${esc(p.nome)}:</b>`);
      const li=[]; if(p.end||p.tel) li.push(`Endereço: ${esc(p.end||'—')}${p.tel?' - '+esc(p.tel):''}`); if(p.reqId) li.push(`Requisitado ${esc(idTxt(p.reqId))}.`); if(p.confId) li.push(`Confirmação de requisição ${esc(idTxt(p.confId))}.`);
      if(li.length) P.push(`<ul>${li.map(x=>`<li>${x}</li>`).join('')}</ul>`); if(p.status) L(esc(p.status)); ref(p); };
    const mp=outros.filter(p=>p.arrolada!=='Defesa'), df=outros.filter(p=>p.arrolada==='Defesa');
    mp.forEach((p,i)=>pes(p,i+1));
    if(c.rolDef==='nao') L(`<b>A Defesa não arrolou testemunhas${c.rolDefId?', '+esc(idTxt(c.rolDefId)):''}.</b>`);
    if(c.rolDef==='traz') L(`A Defesa se comprometeu em intimar e trazer as testemunhas${c.rolDefId?' conforme '+esc(idTxt(c.rolDefId)):''}.`);
    if(df.length){ L(`<b>Testemunhas arroladas pela Defesa${c.rolDefId?', '+esc(idTxt(c.rolDefId)):''}.</b>`); df.forEach((p,i)=>pes(p,i+1)); }
  }
  P.push(SEP);
  if(c.rolMP&&crim&&!r.pecas.some(p=>/rol/i.test(p.nome))) L(`<b>Rol de testemunhas</b> - ${esc(idTxt(c.rolMP))}${c.rolDefId&&c.rolDef==='propria'?' (MP), '+esc(c.rolDefId)+' (Defesa)':''}.`);
  r.pecas.forEach(p=>{ if(p.nome||p.id) L(`<b>${esc(p.nome||'Peça')}</b> - ${esc(idTxt(p.id)||'[pendente]')}${/[.]$/.test(p.id||'')?'':'.'}`); });
  const usados=['classe','assuntos','bu','tco','unidade'];
  T.campos.filter(f=>!usados.includes(f.k)&&String(cp[f.k]||'').trim()).forEach(f=>L(`<b>${esc(f.l)}:</b> ${f.t==='date'?br(cp[f.k]):esc(cp[f.k]).replace(/\n/g,'<br>')}`));
  if(r.fatos&&r.fatos.trim()){ L(`<b>${r.tipo.startsWith('inf')?'Fatos da representação':'Fatos denúncia'}:</b>`); r.fatos.split(/\n+/).map(s=>s.trim()).filter(Boolean).forEach(s=>L(esc(s))); }
  if(c.obs&&c.obs.trim()) L(`<mark><b>${esc(c.obs.toUpperCase())}</b></mark>`);
  return P.join('');
}
function docCumprimento(lista,d){
  const A=AJ(), P=[];
  if(d){ const H=horarios(d), ativos=H.lista.filter(r=>r.resultado!=='cancelada'), pr=ativos.filter(r=>principais(r).some(p=>p.preso)||(r.preso&&tipoDe(r.tipo).preso));
    const sig=[...new Set(H.lista.map(r=>tipoDe(r.tipo).sigla))].join('/');
    const temPreso=ativos.some(r=>tipoDe(r.tipo).preso);
    const tit=!temPreso?`AUDIÊNCIAS ${br(d)} - ${sig}`:pr.length&&pr.length===ativos.length?`AUDIÊNCIAS DE RÉUS PRESOS ${br(d)} - ${sig}`:pr.length?`AUDIÊNCIAS ${br(d)} - ${sig} - RÉUS PRESOS E SOLTOS`:`AUDIÊNCIAS ${br(d)} - ${sig} - RÉU SOLTO`;
    P.push(`<p><b>${esc(tit)} - ${esc(A.comarca.toUpperCase())}/${esc(A.uf)}</b></p>`);
    if(A.link) P.push(`<p><b>LINK:</b></p><p>${esc(A.link)}</p>`);
    P.push('<p>&nbsp;</p>');
    H.lista.forEach((r,i)=>{ const h=H.map[r.id]; P.push(blocoCumprimento(r,h.pos,h.exc?'EXCEDENTE':horaDoc(h.ini))); if(i<H.lista.length-1) P.push('<p>&nbsp;</p>'); });
  } else lista.forEach(r=>{ const h=horaDe(r); P.push(blocoCumprimento(r,h?h.pos:1,h?(h.exc?'EXCEDENTE':horaDoc(h.ini)):'(sem data)')); });
  return P.join('');
}
const DOC_CSS='body{font-family:Arial,Helvetica,sans-serif;font-size:11pt;color:#000;line-height:1.4} p{margin:0 0 4pt} ul{margin:0 0 4pt 18pt;padding:0} li{margin:0} mark{background:#ffff00}';

async function copiarHTMLRico(html){

  div.style.cssText='position:fixed;left:-9999px;font-family:Arial;font-size:11pt'; document.body.appendChild(div); const rg=document.createRange(); rg.selectNodeContents(div); const s=getSelection(); s.removeAllRanges(); s.addRange(rg);
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} s.removeAllRanges(); div.remove(); toast(ok?'Copiado com formatação — cole no Google Docs ou no Word.':'O navegador não permitiu copiar.');
}

  const draw=()=>{ const agora=new Date(), m=agora.getHours()*60+agora.getMinutes(), L=linhasPauta(d), ehHoje=d===hojeISO();
    tv.innerHTML=`<div class="tvh"><div><div class="over">Pauta de audiências · ${esc(AJ().vara)} de ${esc(AJ().comarca)}</div><div class="tvd" style="text-transform:none">${esc(cap(dataLonga(d)))}</div></div><div class="tvc">${agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div><button class="btn onhero" id="tvX">Sair (Esc)</button></div>
      <div style="display:flex;flex-direction:column;gap:8px">${L.map(({r,h})=>{ const atual=ehHoje&&m>=h.ini&&m<h.fim, passou=ehHoje&&m>=h.fim;

const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DSEM=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
let CAL={v:'mes',ref:'',sel:'',tipo:'',preso:false,fds:false};
function infoDia(d){
  let l=diaLista(d).filter(r=>r.resultado!=='cancelada');
  if(CAL.tipo) l=l.filter(r=>r.tipo===CAL.tipo); if(CAL.preso) l=l.filter(r=>r.preso&&tipoDe(r.tipo).preso);
  const sig={}; l.forEach(r=>{ const s=tipoDe(r.tipo).sigla; sig[s]=(sig[s]||0)+1; });
  const o=ocupacao(d), cfg=diaCfg(d);
  return {l,n:l.length,sig,presos:l.filter(r=>r.preso&&tipoDe(r.tipo).preso).length,usado:o.usado,jan:o.jan,pct:o.pct,cheio:o.n&&diaFechado(d),bloq:!!cfg.bloq||DB.config.feriados.includes(d),obs:cfg.obs||'',pauta:ehDiaPauta(d)};
}
function abrirCalendario(v,ref){ CAL.v=v||CAL.v||'mes'; CAL.ref=ref||CAL.ref||diaSel||hojeISO(); if(!CAL.sel) CAL.sel=CAL.ref; renderCal(); }
function calNav(dlt){ const r=parse(CAL.ref);
  if(CAL.v==='ano') CAL.ref=iso(new Date(r.getFullYear()+dlt,r.getMonth(),1));
  else if(CAL.v==='mes') CAL.ref=iso(new Date(r.getFullYear(),r.getMonth()+dlt,1));
  else CAL.ref=addDias(CAL.ref,7*dlt); renderCal(); }
function listaDiaCal(d){
  const I=infoDia(d), H=horarios(d);
  return `<div class="calside"><div class="cs-h"><b>${esc(cap(dataLonga(d)))}</b><span class="cnt">${I.n} audiência(s) · ${I.usado}/${I.jan} min${I.bloq?' · <b style="color:var(--crit-ink)">sem pauta</b>':''}</span></div>
    ${I.obs?`<div class="note" style="margin:6px 0">${esc(I.obs)}</div>`:''}
    <div class="cs-l">${I.l.length?I.l.map(r=>{ const h=H.map[r.id]; return `<div class="aitem" data-cgo="${r.id}" style="--gc:${tipoDe(r.tipo).cor};grid-template-columns:52px 1fr;margin-bottom:5px"><span class="pill ${h.exc?'venc':'aij'}" style="min-width:0">${h.exc?'EXC.':toHora(h.ini)}</span><div style="min-width:0"><div class="t1">${esc(r.proc||'(sem número)')}</div><div class="t2">${esc(tipoDe(r.tipo).sigla)} · ${esc(trunc(nomesPrinc(r)||'partes não cadastradas',46))}${r.preso&&tipoDe(r.tipo).preso?' · preso':''}${r.resultado?' · '+RESULTADOS[r.resultado][0].toLowerCase():''}</div></div></div>`; }).join(''):'<div class="cnt" style="padding:6px 0">Nenhuma audiência neste dia.</div>'}</div>
    <div class="acts" style="margin-top:8px"><button class="btn sm pri" data-cdia="${d}">${ico('agenda',13)} Abrir pauta do dia</button><button class="btn sm" data-cnova="${d}">${ico('mais',13)} Nova neste dia</button><button class="btn sm" data-cbanco="${d}">${ico('banco',13)} Trazer do banco</button></div></div>`;
}
function calMes(){
  const r=parse(CAL.ref), y=r.getFullYear(), m=r.getMonth(), ini=new Date(y,m,1), fim=new Date(y,m+1,0), hoje=hojeISO();
  let d=new Date(ini); d.setDate(1-ini.getDay());
  let tot=0,dias=0,pres=0,min=0; for(let i=1;i<=fim.getDate();i++){ const I=infoDia(iso(new Date(y,m,i))); tot+=I.n; if(I.n) dias++; pres+=I.presos; min+=I.l.reduce((s,x)=>s+(+x.K||0),0); }
  let h=`<div class="cal-sum"><span><b>${tot}</b> audiências</span><span><b>${dias}</b> dias com pauta</span><span><b>${pres}</b> com réu preso/internado</span><span><b>${Math.floor(min/60)}h${min%60?String(min%60).padStart(2,'0'):''}</b> previstas</span></div>
    <div class="calwrap"><div><div class="cm-grid">${DSEM.map(x=>`<div class="cm-wd">${x}</div>`).join('')}`;
  for(let i=0;i<42;i++){ const k=iso(d), I=infoDia(k), fora=d.getMonth()!==m, wd=d.getDay();
    if(i>=35&&fora&&d.getDate()<8) break;
    const sig=Object.entries(I.sig).sort((a,b)=>b[1]-a[1]);
    h+=`<button class="cm-d ${fora?'fora':''} ${k===hoje?'hoje':''} ${k===CAL.sel?'sel':''} ${I.bloq?'bloq':''} ${(wd===0||wd===6)?'fds':''} ${I.n?(I.cheio?'cheio':'tem'):''}" data-cd="${k}" title="${I.n} audiência(s)${I.n?` · ${I.usado}/${I.jan} min`:''}${I.bloq?' · sem pauta':''}${I.obs?' · '+esc(I.obs):''}">
      <div class="cm-top"><span class="cm-n">${d.getDate()}</span>${I.n?`<span class="cm-c">${I.n}</span>`:''}</div>
      <div class="cm-t">${sig.slice(0,3).map(([s,n])=>`<span>${n} ${esc(s)}</span>`).join('')}${sig.length>3?`<span>+${sig.length-3}</span>`:''}</div>
      ${I.presos?`<span class="cm-p" title="Réus presos / internados">${ico('cadeado',11)} ${I.presos}</span>`:''}${I.bloq?`<span class="cm-b">${esc(trunc(I.obs||'sem pauta',16))}</span>`:''}
      ${I.n?`<div class="cm-o"><i style="width:${Math.min(100,I.pct*100)}%;background:${I.pct>=1?'var(--crit)':I.pct>=.8?'#eda100':'var(--good)'}"></i></div>`:''}</button>`;
    d.setDate(d.getDate()+1); }
  h+=`</div></div>${listaDiaCal(CAL.sel&&parse(CAL.sel).getMonth()===m?CAL.sel:iso(ini))}</div>`;
  return h;
}
function calAno(){
  const y=parse(CAL.ref).getFullYear(), hoje=hojeISO(); let tot=0; const mt=[];
  let h='<div class="ca-grid">';
  for(let m=0;m<12;m++){ const ini=new Date(y,m,1), fim=new Date(y,m+1,0); let n=0, cells='';
    for(let i=0;i<ini.getDay();i++) cells+='<span></span>';
    for(let i=1;i<=fim.getDate();i++){ const k=iso(new Date(y,m,i)), I=infoDia(k); n+=I.n; const lv=!I.n?0:I.n<=2?1:I.n<=4?2:I.n<=6?3:4;
      cells+=`<button class="ca-d lv${lv} ${I.cheio?'cheio':''} ${I.bloq?'bloq':''} ${k===hoje?'hoje':''}" data-cd="${k}" title="${br(k)}: ${I.n} audiência(s)${I.bloq?' · sem pauta':''}">${i}</button>`; }
    tot+=n; mt.push(n);
    h+=`<div class="ca-m"><button class="ca-h" data-cm="${iso(ini)}"><span>${cap(MESES[m])}</span><b>${n||''}</b></button><div class="ca-w">${DSEM.map(x=>`<span>${x[0]}</span>`).join('')}</div><div class="ca-c">${cells}</div></div>`; }
  h+='</div>';
  const mx=Math.max(1,...mt);
  return `<div class="cal-sum"><span><b>${tot}</b> audiências em ${y}</span><span class="cal-leg"><i class="lv1"></i>1–2 <i class="lv2"></i>3–4 <i class="lv3"></i>5–6 <i class="lv4"></i>7+ <i class="lvc"></i>pauta fechada</span></div>
    <div class="ca-bars">${mt.map((n,i)=>`<button data-cm="${iso(new Date(y,i,1))}" title="${cap(MESES[i])}: ${n}"><i style="height:${n/mx*100}%"></i><span>${MESES[i].slice(0,3)}</span></button>`).join('')}</div>${h}`;
}
function calSemana(){
  const r=parse(CAL.ref), seg=new Date(r); seg.setDate(r.getDate()-((r.getDay()+6)%7));
  const dias=[]; for(let i=0;i<(CAL.fds?7:5);i++) dias.push(iso(new Date(seg.getFullYear(),seg.getMonth(),seg.getDate()+i)));
  const Hs=dias.map(d=>({d,H:horarios(d),I:infoDia(d)}));
  let a=Math.min(...dias.map(d=>toMin(inicioDia(d)))), b=Math.max(...Hs.map(x=>Math.max(x.H.fimPrev||0,toMin(fimDia(x.d)))));
  a=Math.floor(a/60)*60; b=Math.ceil(b/60)*60; const esc2=1.5, alt=(b-a)*esc2, hoje=hojeISO();
  let horas=''; for(let t=a;t<=b;t+=60) horas+=`<div class="sw-hr" style="top:${(t-a)*esc2}px">${toHora(t)}</div>`;
  const col=({d,H,I})=>{ const lim=toMin(fimDia(d));
    const blocos=H.lista.filter(x=>!CAL.tipo||x.tipo===CAL.tipo).filter(x=>!CAL.preso||(x.preso&&tipoDe(x.tipo).preso)).map(x=>{ const h=H.map[x.id], T=tipoDe(x.tipo), top=(h.ini-a)*esc2, hh=Math.max(18,(+x.K||5)*esc2-2);
      return `<div class="sw-b ${h.exc?'exc':''} ${x.resultado==='cancelada'?'canc':''}" data-cgo="${x.id}" style="top:${top}px;height:${hh}px;--c:${T.cor}" title="${toHora(h.ini)}–${toHora(h.fim)} · ${esc(x.proc)} · ${esc(T.nome)}"><b>${toHora(h.ini)} ${esc(T.sigla)}</b>${hh>30?`<span>${esc(x.proc)}</span>`:''}${hh>46?`<span>${esc(trunc(nomesPrinc(x),34))}${x.preso&&T.preso?' · preso':''}</span>`:''}</div>`; }).join('');
    return `<div class="sw-col ${I.bloq?'bloq':''} ${d===hoje?'hoje':''}"><button class="sw-dh" data-cd="${d}"><span>${DSEM[parse(d).getDay()]} ${ddmm(parse(d))}</span><b>${I.n} aud.</b><small>${I.usado}/${I.jan} min</small></button>
      <div class="sw-body" style="height:${alt}px">${horas.replace(/>\d\d:\d\d</g,'><')}<div class="sw-lim" style="top:${(lim-a)*esc2}px" title="Limite da pauta ${toHora(lim)}"></div>${I.bloq?`<div class="sw-blq">${esc(I.obs||'sem pauta')}</div>`:''}${blocos}</div></div>`; };
  return `<div class="cal-sum"><span>Semana de <b>${ddmm(parse(dias[0]))}</b> a <b>${ddmm(parse(dias[dias.length-1]))}</b></span><span><b>${Hs.reduce((s,x)=>s+x.I.n,0)}</b> audiências</span><label class="chk"><input type="checkbox" id="calFds" ${CAL.fds?'checked':''}> mostrar sábado e domingo</label><span class="cnt">Linha tracejada vermelha = limite da pauta. Clique num bloco para abrir.</span></div>
    <div class="sw-grid" style="grid-template-columns:48px repeat(${dias.length},minmax(0,1fr))"><div><div class="sw-dh" style="visibility:hidden"><span>.</span><b>.</b><small>.</small></div><div class="sw-body sw-hours" style="height:${alt}px">${horas}</div></div>${Hs.map(col).join('')}</div>`;
}
function renderCal(){
  const r=parse(CAL.ref);
  const tit=CAL.v==='ano'?String(r.getFullYear()):CAL.v==='mes'?`${cap(MESES[r.getMonth()])} de ${r.getFullYear()}`:(()=>{ const s=new Date(r); s.setDate(r.getDate()-((r.getDay()+6)%7)); const f=new Date(s); f.setDate(s.getDate()+6); return `${ddmm(s)} a ${ddmm(f)}/${f.getFullYear()}`; })();
  const corpo=CAL.v==='ano'?calAno():CAL.v==='mes'?calMes():calSemana();
  abrirDialogo(`<div class="cal-hd"><h3 style="margin:0">${ico('cal2',18)} Calendário de audiências</h3>
      <span class="seg">${[['ano','Anual'],['mes','Mensal'],['sem','Semanal']].map(([k,n])=>`<button data-cv="${k}" class="${CAL.v===k?'on':''}">${n}</button>`).join('')}</span>
      <span class="daynav"><button class="btn sm ib" data-cn="-1">${ico('esq')}</button><b class="cal-tit">${esc(tit)}</b><button class="btn sm ib" data-cn="1">${ico('dir')}</button><button class="btn sm" data-cn="0">Hoje</button></span>
      <span style="display:flex;gap:6px;align-items:center;margin-left:auto"><select id="calTipo" style="width:auto"><option value="">Todos os tipos</option>${tiposAtivos().map(t=>`<option value="${t.id}" ${CAL.tipo===t.id?'selected':''}>${esc(t.nome)}</option>`).join('')}</select>
      <label class="chk"><input type="checkbox" id="calPreso" ${CAL.preso?'checked':''}> só réus presos</label><button class="btn sm ib" id="calX" title="Fechar">${ico('x',15)}</button></span></div>
    <div class="cal-body">${corpo}</div>`,1180);
  const q=s=>dlgBody.querySelector(s);
  q('#calX').onclick=()=>dlg.close();
  q('#calTipo').onchange=e=>{ CAL.tipo=e.target.value; renderCal(); };
  q('#calPreso').onchange=e=>{ CAL.preso=e.target.checked; renderCal(); };
  if(q('#calFds')) q('#calFds').onchange=e=>{ CAL.fds=e.target.checked; renderCal(); };
  dlgBody.onclick=e=>{
    const v=e.target.closest('[data-cv]'); if(v){ CAL.v=v.dataset.cv; if(CAL.v!=='ano') CAL.ref=CAL.sel||CAL.ref; renderCal(); return; }
    const n=e.target.closest('[data-cn]'); if(n){ if(n.dataset.cn==='0'){ CAL.ref=hojeISO(); CAL.sel=hojeISO(); renderCal(); } else calNav(+n.dataset.cn); return; }
    const cm=e.target.closest('[data-cm]'); if(cm){ CAL.v='mes'; CAL.ref=cm.dataset.cm; CAL.sel=cm.dataset.cm; renderCal(); return; }

    const go=e.target.closest('[data-cgo]'); if(go){ dlg.close(); abrirDrawer(go.dataset.cgo); return; }
    const di=e.target.closest('[data-cdia]'); if(di){ dlg.close(); irDia(di.dataset.cdia); return; }
    const nv=e.target.closest('[data-cnova]'); if(nv){ dlg.close(); novaAudiencia({data:nv.dataset.cnova}); return; }
    const tb=e.target.closest('[data-cbanco]'); if(tb){ dialogoTrazerBanco(tb.dataset.cbanco); return; }
  };
}

/* =====================================================================
   AGENDA GOOGLE — importação (.ics) e exportação
   ===================================================================== */
const NIVEL_OBS={s:'Baixa (Simples)',m:'Média',c:'Alta (Complexo)',mc:'Muito alta (Muito complexo)'};
const tituloCaso=s=>String(s||'').toLowerCase().replace(/(^|[\s(\/–-])([a-zà-ú])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(De|Da|Do|Das|Dos|E|Em|Na|No|Ao|À|Para|Por|Com|A|O)\b/g,w=>w.toLowerCase()).replace(/^./,c=>c.toUpperCase());
function defesaTxt(r){ const t=advTipo(r); return t==='Defensoria Pública'||r.defesa==='Defensoria'?'Defensoria Pública':r.defesa==='Nomeada'||/Nomeado/.test(t)?'Nomeada':r.defesa==='Constituída'||t==='Constituído'?'Constituída':''; }
/* bloco padrão das observações e da Agenda Google */
function blocoObs(r){
  const T=tipoDe(r.tipo), nomes=re=>r.pessoas.filter(p=>re.test(p.papel)).map(p=>p.nome).filter(Boolean);
  const q=(n,rot,l)=>`${+n||0} ${rot}${l.length?` (${l.join(', ')})`:''}`;
  const reus=nomes(/^(Réu|Autor|Adolescente|Acusad|Representad|Interditand|Investigad|Reeducand|Beneficiári|Sentenciad|Apenad)/i), vits=nomes(/^V[ií]tima/i), tes=nomes(/^(Testemunha|Informante)/i);
  return [`Modalidade: ${T.nome.replace(/\s*\([^)]*\)\s*$/,'')}`,
    r.crimes.length?`Tipo Penal: ${r.crimes.map(tituloCaso).join(' / ')}`:'',
    `Complexidade: Nível: ${NIVEL_OBS[r.nivel||'s']}`,
    `Oitivas: ${q(r.nReus,'Réus',reus)}, ${q(r.nVitimas,'Vítimas',vits)}, ${q(r.nTestemunhas,'Testemunhas',tes)}`,
    defesaTxt(r)?`Defesa: ${defesaTxt(r)}`:'',
    `Tempo Previsto: ${r.K} min`].filter(Boolean).join('\n');
}
function descricaoAgenda(r){
  const T=tipoDe(r.tipo);
  return [blocoObs(r), T.preso&&r.preso?'Réu preso: Sim':'', r.horaFixa?`Horário fixo: ${r.horaFixa}`:'', `ID painel: ${r.id}`].filter(Boolean).join('\n');
}
function abrirNoGoogle(r){
  const h=horaDe(r); if(!r.data||!h) return toast('A audiência precisa ter data.');
  const f=m=>r.data.replace(/-/g,'')+'T'+toHora(m).replace(':','')+'00';
  window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(r.proc||tipoDe(r.tipo).sigla)}&dates=${f(h.ini)}/${f(h.fim)}&ctz=America/Sao_Paulo&details=${encodeURIComponent(descricaoAgenda(r))}&location=${encodeURIComponent(AJ().local||'')}`,'_blank');
}
function icsDe(lista){
  const e=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'), st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//TJES//Pauta de Audiencias 2a Vara//PT\r\nCALSCALE:GREGORIAN\r\nX-WR-TIMEZONE:America/Sao_Paulo\r\n';
  lista.forEach(r=>{ const h=horaDe(r); if(!h) return; const dt=r.data.replace(/-/g,'');
    ics+=`BEGIN:VEVENT\r\nUID:${r.gcalUid||r.id+'@pauta-2vara'}\r\nDTSTAMP:${st}\r\nSUMMARY:${e(r.proc||tipoDe(r.tipo).sigla)}\r\nDTSTART;TZID=America/Sao_Paulo:${dt}T${toHora(h.ini).replace(':','')}00\r\nDTEND;TZID=America/Sao_Paulo:${dt}T${toHora(h.fim).replace(':','')}00\r\nDESCRIPTION:${e(descricaoAgenda(r))}\r\nLOCATION:${e(AJ().local||'')}\r\n${r.resultado==='cancelada'?'STATUS:CANCELLED\r\n':''}END:VEVENT\r\n`; });
  return ics+'END:VCALENDAR';
}
function dialogoExportarAgenda(){
  let de=hojeISO(), ate=addDias(hojeISO(),180);

    <div class="fgrid"><div class="fld"><label>De</label><input type="date" id="exDe" value="${de}"></div><div class="fld"><label>Até</label><input type="date" id="exAte" value="${ate}"></div>
    <div class="fld full"><label class="chk"><input type="checkbox" id="exReal"> incluir realizadas e encerradas</label></div></div>
    <div class="mfoot"><button class="btn" id="exC">Cancelar</button><button class="btn pri" id="exO">${ico('salvar',14)} Baixar .ics</button></div>`);
  dlgBody.querySelector('#exC').onclick=()=>dlg.close();
  dlgBody.querySelector('#exO').onclick=()=>{ const a=dlgBody.querySelector('#exDe').value, b=dlgBody.querySelector('#exAte').value, re=dlgBody.querySelector('#exReal').checked;

    baixar(`audiencias_${a}_a_${b}.ics`,icsDe(l),'text/calendar;charset=utf-8'); dlg.close(); toast(`${l.length} audiência(s) exportada(s).`); };

/* ---------- leitura do .ics ---------- */
function lerICS(txt){
  txt=String(txt).replace(/\r\n/g,'\n').replace(/\n[ \t]/g,'');
  const un=v=>v.replace(/\\n/gi,'\n').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\');
  const out=[];
  txt.split('BEGIN:VEVENT').slice(1).forEach(bl=>{ bl=bl.split('END:VEVENT')[0]; const ev={};

function tipoDoTexto(T,diaJuri){

  if(/CONCENTRADA|ACOLHIMENTO/.test(T)) return 'concentrada';
  if(/INTERDI|CURATELA/.test(T)) return 'interdicao';
  if(/JUSTIFICA/.test(T)) return 'justif';
  if(/\bMSE\b|MEDIDA SOCIOEDUCATIVA|LIBERDADE ASSISTIDA/.test(T)) return 'mse';
  if(/APRESENTA/.test(T)&&/MENOR|ADOLESC|INFRACION|APRESENTACAO/.test(T)) return 'inf_apres';
  if(/ATO INFRACIONAL|ADOLESCENTE/.test(T)) return /CONTINUA/.test(T)?'inf_cont':'inf_apres';

  let nT=num(/NUMERO DE TESTEMUNHAS:?\s*(\d+(?:\.\d+)?)/)??num(/(\d+)\s*TESTEMUNHAS?\b/)??num(/(\d+)\s*T\b/);

}
function analisarAgenda(evs){
  const marc={}, bloq=[], ign=[], aud=[];

function iaPrompt(multi){

Leia principalmente: capa do PJe, denúncia (ou representação/TCO), rol de testemunhas da acusação, resposta à acusação (rol da defesa), decisão de recebimento, procurações/nomeações e certidões de citação ou de prisão.

Regras:

7. Tipo de audiência: escolha um destes códigos (normalmente "aij" para ação penal com denúncia recebida; "jecrim_prel" para TCO/JECrim antes da transação; "inf_apres" para representação de ato infracional; "juri" só após pronúncia):
${tipos}
8. Fatos: copie INTEGRALMENTE o texto da narrativa dos fatos da denúncia (ou representação/queixa/TCO), palavra por palavra, sem resumir nem omitir trechos, mantendo os parágrafos. Se houver aditamento à denúncia, inclua também o texto do aditamento ao final, precedido de "ADITAMENTO:".
${multi?`

VÁRIOS PROCESSOS: podem ter sido anexados vários PDFs (um por processo, ou mais de um PDF do mesmo processo). Responda com UM ÚNICO ARRAY JSON, com um objeto por PROCESSO (agrupe os PDFs do mesmo número), na ordem dos anexos. Mesmo que seja um processo só, responda com um array de um elemento.
Responda SOMENTE com o JSON, dentro de um único bloco de código \`\`\`json, sem nenhum texto antes ou depois, sem comentários e sem vírgula sobrando. Use exatamente os nomes de campos do modelo abaixo; quando não houver a informação, use "" (texto), [] (lista) ou false.
Se a resposta for ficar muito longa e precisar ser cortada, pare no fim de um processo completo, feche o array e escreva depois do bloco: CONTINUA. Eu pedirei "continue" e você mandará um novo array só com os processos restantes.`:'\nResponda apenas com o JSON no formato pedido.'}`;

/* ---------- chamadas à API ---------- */
async function iaFetch(url,opt,tent){ tent=tent||0; const c=iaCfg(); const ac=new AbortController(), to=setTimeout(()=>ac.abort(),240000);
  let res; try{ res=await fetch(url,Object.assign({},opt,{signal:ac.signal,headers:Object.assign({'x-goog-api-key':c.key},opt.headers||{})})); }
  catch(e){ clearTimeout(to); if(tent<2) { await new Promise(r=>setTimeout(r,2500)); return iaFetch(url,opt,tent+1); } throw new Error(e.name==='AbortError'?'Tempo esgotado (o PDF pode ser grande demais).':'Sem conexão com o Google (verifique a internet).'); }
  clearTimeout(to);
  if((res.status===429||res.status===500||res.status===503)&&tent<3){ await new Promise(r=>setTimeout(r,[4000,10000,25000][tent])); return iaFetch(url,opt,tent+1); }
  if(!res.ok){ let m=''; try{ const j=await res.json(); m=j.error&&j.error.message||''; }catch(e){}
    if(res.status===400&&/API key/i.test(m)) throw new Error('Chave de API inválida.');
    if(res.status===403) throw new Error('Chave sem permissão para a API Gemini. '+m);
    if(res.status===404) throw new Error('Modelo não encontrado. Escolha outro nos ajustes da IA. '+m);
    if(res.status===429) throw new Error('Limite de uso da API atingido. Aguarde alguns minutos. '+m);
    if(res.status===413) throw new Error('PDF grande demais.');
    throw new Error(`Erro ${res.status}: ${m||res.statusText}`); }
  return res;
}
const b64De=f=>new Promise((ok,er)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]); r.onerror=()=>er(new Error('Não consegui ler o arquivo.')); r.readAsDataURL(f); });
async function iaEnviarArquivo(f,onSt){
  if(f.size<=18*1024*1024){ onSt('preparando'); return {inline_data:{mime_type:'application/pdf',data:await b64De(f)}}; }
  if(f.size>1900*1024*1024) throw new Error('Arquivo acima de 2 GB.');
  onSt('enviando PDF grande'); const bd='----pauta'+uid();
  const meta=JSON.stringify({file:{display_name:f.name.slice(0,120)}});
  const body=new Blob([`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${bd}\r\nContent-Type: application/pdf\r\n\r\n`,f,`\r\n--${bd}--\r\n`]);
  const r=await iaFetch(`${IA_API}/upload/v1beta/files?uploadType=multipart`,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd,'X-Goog-Upload-Protocol':'multipart'},body});
  let fl=(await r.json()).file; onSt('Google processando o PDF');
  for(let i=0;i<60&&fl.state==='PROCESSING';i++){ await new Promise(s=>setTimeout(s,3000)); fl=await (await iaFetch(`${IA_API}/v1beta/${fl.name}`,{method:'GET'})).json(); }
  if(fl.state!=='ACTIVE') throw new Error('O Google não conseguiu processar o PDF.');
  return {file_data:{mime_type:'application/pdf',file_uri:fl.uri}};
}
async function iaLerPDF(f,onSt){
  const c=iaCfg(); if(!c.key) throw new Error('Cadastre a chave da API Gemini.');
  const part=await iaEnviarArquivo(f,onSt); onSt('IA lendo o processo');
  const body={contents:[{role:'user',parts:[part,{text:iaPrompt()}]}],generationConfig:{temperature:0.1,responseMimeType:'application/json',responseSchema:iaSchema()}};
  const r=await iaFetch(`${IA_API}/v1beta/models/${encodeURIComponent(c.modelo||'gemini-flash-latest')}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  if(j.promptFeedback&&j.promptFeedback.blockReason) throw new Error('O Google bloqueou a leitura deste PDF ('+j.promptFeedback.blockReason+').');
  const cand=(j.candidates||[])[0]; if(!cand) throw new Error('A IA não devolveu resposta.');
  const txt=((cand.content||{}).parts||[]).map(p=>p.text||'').join('');
  if(!txt) throw new Error('Resposta vazia'+(cand.finishReason?` (${cand.finishReason})`:'')+'.');
  const o=iaParseJSON(txt); o._uso=j.usageMetadata||null; return o;
}
function iaParseJSON(t){ t=String(t).trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,''); try{ return JSON.parse(t); }catch(e){ const a=t.indexOf('{'), b=t.lastIndexOf('}'); if(a>=0&&b>a) return JSON.parse(t.slice(a,b+1)); throw new Error('A resposta não veio em JSON válido.'); } }
async function iaListarModelos(){
  const r=await iaFetch(`${IA_API}/v1beta/models?pageSize=200`,{method:'GET'}); const j=await r.json();
  return (j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')&&/gemini/.test(m.name)&&!/embed|image|tts|audio|live|vision-only|robotics|computer/i.test(m.name)).map(m=>({id:m.name.replace('models/',''),nome:m.displayName||m.name}));
}

function iaCrime(c){
  const nome=String(c.nome||'').trim(), art=String(c.artigo||'').trim(); if(!nome&&!art) return null;
  let v=nome?casarCrime(nome):''; if(v&&todosCrimes().some(t=>t.v===v)) return v;
  if(art){ const nq=norm(art), m=nq.match(/\d+(?:-[A-Z])?/); const b=buscaCrimes(art,1)[0]; if(b&&scoreCrime(b,nq,m?m[0]:'')<=1) return b.v; }
  return v||nome.toUpperCase();
}
function iaNormalizar(x,nomeArq){
  const o={arq:nomeArq||'',ok:true};
  const mp=String(x.processo||'').match(RX_PROC)||String(nomeArq||'').match(RX_PROC);
  o.proc=mp?`${mp[1]}-${mp[2]}.${mp[3]}.${mp[4]}.${mp[5]}.${mp[6]}`:String(x.processo||'').trim();
  o.tipo=tiposAtivos().some(t=>t.id===x.tipo_audiencia)?x.tipo_audiencia:'aij';
  o.crimes=[...new Set((x.crimes||[]).map(iaCrime).filter(Boolean))];
  const L=a=>(Array.isArray(a)?a:[]).filter(p=>p&&String(p.nome||'').trim());
  o.reus=L(x.reus); o.vitimas=L(x.vitimas); o.testemunhas=L(x.testemunhas); o.advs=L(x.advogados);
  o.defesa={Constituída:'Constituída',Nomeada:'Nomeada',Defensoria:'Defensoria'}[x.defesa]||(o.advs.some(a=>a.tipo==='Defensoria Pública')?'Defensoria':o.advs.some(a=>/Nomeado/.test(a.tipo))?'Nomeada':o.advs.length?'Constituída':'');
  o.preso=!!x.reu_preso||o.reus.some(r=>r.preso);
  o.nReus=Math.max(o.reus.length,tipoDe(o.tipo).crimes?1:0); o.nVitimas=o.vitimas.length; o.nTestemunhas=o.testemunhas.length;
  o.fatos=String(x.fatos||'').trim(); o.classe=CLASSES.find(c=>norm(c)===norm(x.classe||''))||'';
  o.classeTxt=String(x.classe||''); o.assuntos=String(x.assuntos||''); o.bu=String(x.numero_bu||''); o.dataFatos=String(x.data_fatos||''); o.pend=String(x.pendencias||''); o.pags=String(x.paginas||'');
  o.unidade=(o.reus.find(r=>r.preso&&r.unidade_prisional)||{}).unidade_prisional||'';
  o.uso=x._uso; o.existe=o.proc?DB.registros.find(r=>r.proc===o.proc&&!r.resultado)||null:null; o.inc=true;
  return o;
}
const iaUp=s=>String(s||'').trim().toUpperCase();
function iaPessoas(o,r){
  const papelP=tipoDe(r.tipo).papeis.find(p=>PAPEL_PRINC.includes(p))||'Réu', tem=new Set(r.pessoas.map(p=>norm(p.nome)));
  const add=(papel,d,extra)=>{ const n=iaUp(d.nome); if(!n||tem.has(norm(n))) return; tem.add(norm(n)); const p=novaPessoa(papel,r); p.nome=n; p.cargo=String(d.qualificacao||d.cargo||'').trim(); p.end=String(d.endereco||'').trim(); p.tel=String(d.telefone||'').trim(); Object.assign(p,extra||{}); r.pessoas.push(p); };
  o.reus.forEach(d=>add(papelP,d,{preso:!!d.preso&&!!tipoDe(r.tipo).preso,unidade:String(d.unidade_prisional||'')}));
  o.vitimas.forEach(d=>add('Vítima',d,d.menor?{cargo:(String(d.qualificacao||'').trim()+' (menor)').trim()}:null));
  o.testemunhas.forEach(d=>add(d.informante?'Informante':'Testemunha',d,{arrolada:ARROL.includes(d.arrolada_por)?d.arrolada_por:'MP'}));
  const ta=new Set(r.advs.map(a=>norm(a.nome)));
  o.advs.forEach(a=>{ let n=String(a.nome||'').trim(); if(a.tipo==='Defensoria Pública') n='Defensoria Pública'; if(!n||ta.has(norm(n))) return; ta.add(norm(n)); r.advs.push({id:uid(),papel:/V[IÍ]TIMA/i.test(a.de_quem||'')?'Advogado(a) da vítima':'Defesa',tipo:a.tipo||'Constituído',nome:a.tipo==='Defensoria Pública'?'Defensoria Pública':n,oab:a.tipo==='Defensoria Pública'?'':String(a.oab||''),tel:'',status:'',deQuem:String(a.de_quem||'')}); });
}
function iaAplicar(o,alvo){
  o.crimes.forEach(c=>{ if(!todosCrimes().some(t=>t.v===c)) DB.config.crimesExtra.push({v:c,g:grupoAuto(c),art:'',pts:10}); });
  const nota=`Lido por IA (Gemini) em ${br(hojeISO())}${o.arq?' — '+o.arq:''}.${o.pend?'\nPendências apontadas: '+o.pend:''}${o.dataFatos?'\nData dos fatos: '+o.dataFatos:''}`;
  let r=alvo;
  if(r){ // completa a existente sem apagar o que já foi feito
    if(!r.proc&&o.proc) r.proc=o.proc;
    if(o.crimes.length&&(!r.crimes.length||r.gcalUid)) r.crimes=o.crimes;
    if(o.defesa&&(!r.defesa||r.gcalUid)) r.defesa=o.defesa;
    if(o.preso) r.preso=true;
    r.nReus=Math.max(+r.nReus||0,o.nReus); r.nVitimas=Math.max(o.nVitimas,r.gcalUid?0:+r.nVitimas||0); r.nTestemunhas=Math.max(o.nTestemunhas,r.gcalUid?0:+r.nTestemunhas||0);
    if(o.fatos&&(!r.fatos||o.fatos.length>r.fatos.length)) r.fatos=o.fatos;
    iaPessoas(o,r); logar(r,'Dados completados pela IA',o.arq||'');
  } else {
    r={id:novoId(),tipo:o.tipo,proc:o.proc,nomeRapido:'',crimes:o.crimes,defesa:o.defesa,preso:o.preso,nReus:o.nReus,nVitimas:o.nVitimas,nTestemunhas:o.nTestemunhas,extra:0,K:0,Kman:false,

    iaPessoas(o,r); DB.registros.push(r); logar(r,'Cadastrada pela leitura com IA',o.arq||'');
  }
  const C=r.campos=r.campos||{}; if(o.classe&&!C.classe) C.classe=o.classe; if(o.assuntos&&!C.assuntos) C.assuntos=o.assuntos; if(o.bu&&!C.bu) C.bu=o.bu; if(o.unidade&&!C.unidade) C.unidade=o.unidade;
  r.obs=(r.obs?r.obs+'\n\n':'')+nota;
  if(o.pend) (r.tarefas=r.tarefas||[]).push({id:uid(),texto:'Verificar pendências apontadas pela IA: '+trunc(o.pend,160),resp:EU,prazo:'',feita:false,criadaEm:hojeISO(),autor:EU});
  if(!r.etiquetas.includes('Lido por IA')) r.etiquetas.push('Lido por IA');
  recalcular(r);
  const bl=blocoObs(r); r.obs=r.obs.replace(/^Modalidade:[^\n]*(\n(Tipo Penal|Complexidade|Oitivas|Defesa|Tempo Previsto):[^\n]*)*\n*/,''); r.obs=bl+'\n\n'+r.obs;
  return r;
}

function iaPromptSite(multi){
  const m=iaModeloJSON();
  return iaPrompt(true)+`\n\nSignificado dos campos:\n- processo: número CNJ (0000000-00.0000.0.00.0000)\n- tipo_audiencia: um dos códigos da regra 7\n- crimes: lista {nome, artigo}\n- reus / vitimas / testemunhas: listas de pessoas (nome completo em maiúsculas; qualificação, endereço e telefone quando houver)\n- testemunhas.arrolada_por: "MP", "Defesa", "Juízo", "Assistente de acusação" ou "MP e Defesa"\n- advogados.tipo: "Constituído", "Nomeado (dativo)" ou "Defensoria Pública"\n- defesa: "Constituída", "Nomeada", "Defensoria" ou "Não informada"\n- reu_preso: true/false (situação atual)\n- fatos: TEXTO INTEGRAL da narrativa dos fatos (sem resumo)\n- pendencias: o que pode impedir a audiência (citação, intimação, laudo, precatória)\n\nModelo exato da resposta:\n\`\`\`json\n`+JSON.stringify([m],null,1)+`\n\`\`\``;
}
function iaParseVarios(t){
  t=String(t);
  const blocos=[...t.matchAll(/```(?:json)?\s*([\s\S]*?)```/gi)].map(m=>m[1]);
  const fontes=blocos.length?blocos:[t];
  const out=[];
  fontes.forEach(s=>{ s=s.trim(); if(!s) return;
    const tenta=x=>{ try{ return JSON.parse(x); }catch(e){ try{ return JSON.parse(x.replace(/,\s*([\]}])/g,'$1').replace(/[\u201c\u201d]/g,'"')); }catch(e2){ return undefined; } } };
    let v=tenta(s);
    if(v===undefined){ const a=s.indexOf('['), b=s.lastIndexOf(']'), c=s.indexOf('{'), d=s.lastIndexOf('}');
      if(a>=0&&b>a&&(c<0||a<c)) v=tenta(s.slice(a,b+1)); if(v===undefined&&c>=0&&d>c) v=tenta(s.slice(c,d+1));
      if(v===undefined&&c>=0&&d>c) v=tenta('['+s.slice(c,d+1)+']'); }
    if(v===undefined) throw new Error('A resposta colada não é um JSON válido. Cole o bloco de código inteiro.');
    (Array.isArray(v)?v:(v&&Array.isArray(v.processos)?v.processos:[v])).forEach(x=>{ if(x&&typeof x==='object') out.push(x); });
  });
  return out;
}
function iaModeloJSON(){ return {processo:'',classe:'',assuntos:'',tipo_audiencia:'aij',crimes:[{nome:'',artigo:''}],reus:[{nome:'',qualificacao:'',endereco:'',telefone:'',preso:false,unidade_prisional:''}],vitimas:[{nome:'',qualificacao:'',endereco:'',telefone:'',menor:false}],testemunhas:[{nome:'',cargo:'',endereco:'',telefone:'',arrolada_por:'MP | Defesa | Juízo | MP e Defesa',informante:false}],advogados:[{nome:'',oab:'',tipo:'Constituído | Nomeado (dativo) | Defensoria Pública',de_quem:''}],defesa:'Constituída | Nomeada | Defensoria | Não informada',reu_preso:false,fatos:'',data_fatos:'',numero_bu:'',pendencias:'',paginas:''}; }
function iaAdicionar(fs){
  const pdfs=fs.filter(f=>/\.pdf$/i.test(f.name)||f.type==='application/pdf'); if(!pdfs.length) return toast('Escolha arquivos PDF.');
  if(fs.length>pdfs.length) toast(`${fs.length-pdfs.length} arquivo(s) ignorado(s) por não serem PDF.`);
  if(IAQ.alvo){ IAQ.itens=IAQ.itens.filter(i=>i.feito); pdfs.splice(1); }
  pdfs.forEach(f=>IAQ.itens.push({f,st:'',erro:'',o:null}));
  if(!iaCfg().key){ renderIA(); toast('Cadastre a chave da API Gemini (ou use pelo site do Gemini).'); return; }
  iaRodar(); renderIA();
}
async function iaRodar(){
  if(IAQ.rodando) return; IAQ.rodando=true; const Q=IAQ;
  const prox=()=>Q.itens.find(i=>!i.o&&!i.erro&&!i.lendo&&i.f);
  const worker=async()=>{ let it; while((it=prox())){ it.lendo=true;
      try{ const x=await iaLerPDF(it.f,s=>{ it.st=s; iaAtualizarLinha(); }); it.o=iaNormalizar(x,it.f.name); if(x._uso) Q.custo=(Q.custo||0)+(x._uso.totalTokenCount||0); }
      catch(e){ it.erro=e.message||String(e); if(/Chave|permissão/.test(it.erro)) Q.itens.forEach(o=>{ if(!o.o&&!o.lendo&&!o.erro) o.erro=it.erro; }); }
      it.lendo=false; iaAtualizarLinha(true); } };
  await Promise.all(Array.from({length:Math.max(1,Math.min(4,iaCfg().paralelo||2))},worker));
  Q.rodando=false; iaAtualizarLinha(true);
  if(Q.itens.some(i=>i.o&&!i.feito)) toast(`Leitura concluída: ${Q.itens.filter(i=>i.o&&!i.feito).length} pronto(s) para revisar.`);
}
let iaT=null;
function iaAtualizarLinha(forte){ if(!dlg.open||!dlgBody.querySelector('#iaDrop')) return; clearTimeout(iaT); iaT=setTimeout(()=>{ const s=dlgBody.querySelector('.ialist'), y=s?s.scrollTop:0; renderIA(); const n=dlgBody.querySelector('.ialist'); if(n) n.scrollTop=y; },forte?0:250); }
function iaGravar(){
  const Q=IAQ, alvo=Q.alvo&&byId(Q.alvo); const l=Q.itens.filter(i=>i.o&&i.o.inc&&!i.feito); if(!l.length) return;
  let nov=0, comp=0, ult=null;
  l.forEach(it=>{ const o=it.o; const dest=alvo||(Q.completar&&o.existe?o.existe:null); const r=iaAplicar(o,dest); ult=r; if(dest){ comp++; it.feito='completada'; } else { nov++; it.feito='gravada no banco'; } it.id=r.id; });
  salvar(); renderTudo();
  if(alvo){ dlg.close(); renderDrawer(alvo); toast('Audiência completada com os dados lidos pela IA.',true); return; }
  toast(`${nov} audiência(s) criada(s) no banco${comp?`, ${comp} completada(s)`:''}.`,true);
  if(l.length===1&&ult){ dlg.close(); abrirDrawer(ult.id); } else renderIA();
}

/* ---------- busca global ---------- */
function abrirBusca(){
  abrirDialogo(`<input id="bgQ" placeholder="Buscar processo, parte, advogado, tipo penal…" autofocus style="font-size:16px;padding:12px 14px"><div id="bgRes" style="max-height:60vh;overflow:auto;margin-top:10px"></div><div class="cnt" style="margin-top:8px"><span class="kbd">↑</span> <span class="kbd">↓</span> navegar · <span class="kbd">Enter</span> abrir · <span class="kbd">Esc</span> fechar · atalho <span class="kbd">Ctrl</span>+<span class="kbd">K</span></div>`,760);
  const q=dlgBody.querySelector('#bgQ'), res=dlgBody.querySelector('#bgRes'); let s=0;
  const run=()=>{ const t=norm(q.value), dg=q.value.replace(/\D/g,''); if(t.length<2){ res.innerHTML='<div class="cnt">Digite ao menos 2 caracteres.</div>'; return; }
    const l=DB.registros.filter(r=>norm([r.proc,nomesPrinc(r),r.pessoas.map(p=>p.nome).join(' '),r.advs.map(a=>a.nome+' '+a.oab).join(' '),r.crimes.join(' '),tipoDe(r.tipo).nome].join(' ')).includes(t)||(dg.length>=4&&String(r.proc).replace(/\D/g,'').includes(dg))).slice(0,40);
    res.innerHTML=l.length?l.map(r=>{ const h=horaDe(r); return `<div class="aitem bg" data-go="${r.id}" style="--gc:${tipoDe(r.tipo).cor};grid-template-columns:110px 1fr auto"><span class="pill ${r.resultado?'real':r.data?'aij':'tf'}">${r.data?br(r.data)+(h&&!h.exc?' '+toHora(h.ini):''):'banco'}</span><div style="min-width:0"><div class="t1">${esc(r.proc||'(sem número)')}</div><div class="t2">${esc(tipoDe(r.tipo).nome)} · ${esc(nomesPrinc(r))}</div></div><span class="cnt">${r.resultado?RESULTADOS[r.resultado][0]:''}</span></div>`; }).join(''):'<div class="empty">Nada encontrado.</div>';
    s=0; marca(); };
  const itens=()=>[...res.querySelectorAll('.bg')], marca=()=>itens().forEach((x,i)=>x.style.borderColor=i===s?'var(--accent)':'transparent');
  const abrir=el=>{ if(!el) return; dlg.close(); abrirDrawer(el.dataset.go); };
  q.oninput=run; run();
  q.onkeydown=e=>{ const l=itens(); if(e.key==='ArrowDown'){ e.preventDefault(); s=Math.min(l.length-1,s+1); marca(); } if(e.key==='ArrowUp'){ e.preventDefault(); s=Math.max(0,s-1); marca(); } if(e.key==='Enter'){ e.preventDefault(); abrir(l[s]); } };
  dlgBody.onclick=e=>{ const el=e.target.closest('.bg'); if(el) abrir(el); };
}

function abrirTarefas(){

function abrirEstat(){

  const S={}; const ser=[['realizada','Realizadas','#0ca30c'],['redesignada','Redesignadas','#eda100'],['cancelada','Canceladas','#7d7b74'],['nao_realizada','Não realizadas','#d03b3b']]; meses.forEach(m=>{ S[m]={}; ser.forEach(s=>S[m][s[0]]=0); });
  DB.registros.forEach(r=>{ if(r.resultado&&r.data&&S[r.data.slice(0,7)]) S[r.data.slice(0,7)][r.resultado]++; r.hist.forEach(h=>{ if(h.res==='redesignada'&&h.data&&S[h.data.slice(0,7)]) S[h.data.slice(0,7)].redesignada++; }); });

  meses.forEach((m,i)=>{ let y=H-pb; ser.forEach(s=>{ const v=S[m][s[0]], h=(H-pb-10)*v/max; if(v){ y-=h; svg+=`<rect x="${pl+i*bw+bw*.2}" y="${y}" width="${bw*.6}" height="${h}" fill="${s[2]}"><title>${s[1]} — ${m.split('-').reverse().join('/')}: ${v}</title></rect>`; } });
    svg+=`<text x="${pl+i*bw+bw/2}" y="${H-7}" text-anchor="middle" font-size="10" fill="var(--muted)">${['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+m.slice(5)-1]}/${m.slice(2,4)}</text>`; });

  const real=DB.registros.filter(r=>r.resultado==='realizada').length, redes=DB.registros.reduce((s,r)=>s+r.hist.filter(h=>h.res==='redesignada').length,0), tot=real+redes+DB.registros.filter(r=>['cancelada','nao_realizada'].includes(r.resultado)).length;

    <div class="kpi" style="--c:#2a78d6;cursor:default"><div class="ic">${ico('barras',19)}</div><div class="v">${tot?Math.round(real/tot*100):0}%</div><div class="l">taxa de realização</div></div><div class="kpi" style="--c:#6a4fc7;cursor:default"><div class="ic">${ico('banco',19)}</div><div class="v">${DB.registros.filter(r=>!r.resultado&&!r.data).length}</div><div class="l">no banco</div></div></div>
    <div class="legendline" style="margin:0 0 6px">${ser.map(s=>`<span style="display:inline-flex;gap:5px;align-items:center"><span style="width:12px;height:12px;border-radius:3px;background:${s[2]}"></span>${s[1]}</span>`).join('')}</div>${svg}

const ERROS_FB={'auth/invalid-credential':'Login ou senha incorretos.','auth/wrong-password':'Senha incorreta.','auth/user-not-found':'Ainda não existe conta para este login. Peça ao administrador para criar o seu acesso.','auth/invalid-email':'Login inválido — use só letras e números.','auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos e tente de novo.','auth/network-request-failed':'Sem conexão com o Firebase. Verifique a internet ou a liberação da rede.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.','auth/requires-recent-login':'Por segurança, saia e entre de novo antes de trocar a senha.','auth/operation-not-allowed':'Ative o método E-mail/senha no Firebase (Authentication → Sign-in method).','auth/admin-restricted-operation':'A criação de contas está desligada no Firebase (Authentication → Configurações → Ações do usuário).','permission-denied':'A sua conta existe, mas as regras do Firestore não liberam a coleção "pauta". Cole as regras de Ajustes → Sincronização no Firebase.'};
const msgFB=e=>{ if(e&&e.code&&ERROS_FB[e.code]) return ERROS_FB[e.code]; const m=(e&&(e.message||e.code))||'erro desconhecido';
  if(/dynamically imported module|Failed to fetch|NetworkError/i.test(m)) return 'Não consegui carregar o Firebase. Verifique a internet ou se a rede libera www.gstatic.com e firestore.googleapis.com.';
  if(/permission/i.test(m)) return ERROS_FB['permission-denied']; return m; };
function comPrazo(p,ms,msg){ let id; return Promise.race([Promise.resolve(p).finally(()=>clearTimeout(id)),new Promise((_,rej)=>{ id=setTimeout(()=>rej(new Error(msg)),ms); })]); }

const SYNC={on:false,viaRest:false,transporte:'',fs:null,db:null,col:null,erro:'',erroPush:'',aplicando:false,unsub:null,auth:null,mod:null,dbApp:null,ultimaLeitura:''};
