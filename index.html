const salvarPend=()=>{ try{ localStorage.setItem('pauta-pendentes',JSON.stringify([...PEND].slice(-3000))); }catch(e){} };
let ULT_OK=''; try{ ULT_OK=localStorage.getItem('pauta-ult-envio')||''; }catch(e){}
const ERROS_SYNC=[]; const anotarErro=m=>{ ERROS_SYNC.unshift({ts:new Date().toISOString(),m:String(m).slice(0,200)}); if(ERROS_SYNC.length>8) ERROS_SYNC.pop(); };
const ehCota=e=>/RESOURCE_EXHAUSTED|resource-exhausted|429|quota/i.test(((e&&e.message)||'')+' '+((e&&e.code)||''));
let GRAV={dia:'',n:0}; try{ const g=JSON.parse(localStorage.getItem('pauta-gravacoes')||'null'); if(g&&g.dia) GRAV=g; }catch(e){}
function contarGrav(n){ const h=hojeISO(); if(GRAV.dia!==h) GRAV={dia:h,n:0}; GRAV.n+=n||0; try{ localStorage.setItem('pauta-gravacoes',JSON.stringify(GRAV)); }catch(e){} }

const viaRestLigada=()=>{ try{ return localStorage.getItem('pauta-via-direta')==='1'; }catch(e){ return false; } };
function ligarViaRest(v){ try{ v?localStorage.setItem('pauta-via-direta','1'):localStorage.removeItem('pauta-via-direta'); }catch(e){} SYNC.viaRest=!!v; }

async function prepararFirebase(){
  const c=syncCfg(); if(!c||!c.projectId) return null; if(SYNC.auth) return SYNC;
  const [app,auth,fs]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]);
  const a=app.getApps&&app.getApps().length?app.getApps()[0]:app.initializeApp(c);
  SYNC.mod={app,auth,fs}; SYNC.auth=auth.getAuth(a); SYNC.dbApp=a; SYNC.transporte='padrão';
  try{ if(fs.initializeFirestore){ SYNC.db=fs.initializeFirestore(a,c.longPolling===false?{experimentalAutoDetectLongPolling:true}:{experimentalForceLongPolling:true}); SYNC.transporte=c.longPolling===false?'detecção automática':'long polling'; } }catch(e){ SYNC.db=null; }
  if(!SYNC.db){ try{ SYNC.db=fs.getFirestore(a); }catch(e){} }
  try{ await auth.setPersistence(SYNC.auth,auth.browserLocalPersistence); }catch(e){}
  return SYNC;
}
function esperarAuth(){ return new Promise(res=>{ const {auth}=SYNC.mod; if(!auth.onAuthStateChanged) return res(SYNC.auth.currentUser); let ok=false;
  const un=auth.onAuthStateChanged(SYNC.auth,u=>{ if(ok) return; ok=true; try{un();}catch(e){} res(u); }); setTimeout(()=>{ if(!ok){ ok=true; res(SYNC.auth.currentUser); } },5000); }); }
async function loginFirebase(u,senha){ await prepararFirebase(); await SYNC.mod.auth.signInWithEmailAndPassword(SYNC.auth,emailDe(u),senha||''); }
async function sairFirebase(){ try{ if(SYNC.auth&&SYNC.mod) await SYNC.mod.auth.signOut(SYNC.auth); }catch(e){} if(SYNC.unsub){ SYNC.unsub(); SYNC.unsub=null; } SYNC.on=false; statusSync(); }
async function criarContaEquipe(login,senha){
  if(!nuvem()) throw new Error('O painel não está ligado ao banco online.'); if(!senha||senha.length<6) throw {code:'auth/weak-password'};
  await prepararFirebase(); const {app,auth}=SYNC.mod; let app2=null;
  try{ app2=app.initializeApp(syncCfg(),'criar-'+Date.now()); const au2=auth.getAuth(app2);
    await comPrazo(auth.createUserWithEmailAndPassword(au2,emailDe(login),senha),25000,'O Firebase não respondeu a tempo.'); try{ await auth.signOut(au2); }catch(e){} }
  finally{ if(app2&&app.deleteApp){ try{ await app.deleteApp(app2); }catch(e){} } }
}

/* ---------- via direta (REST do Firestore) para redes que cortam o canal do Firebase ---------- */
function fsVal(v){ if(v===null||v===undefined) return {nullValue:null}; if(typeof v==='boolean') return {booleanValue:v};
  if(typeof v==='number') return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v}; if(typeof v==='string') return {stringValue:v};
  if(Array.isArray(v)) return {arrayValue:v.length?{values:v.map(fsVal)}:{}};
  if(typeof v==='object'){ const f={}; Object.keys(v).forEach(k=>{ f[k]=fsVal(v[k]); }); return {mapValue:{fields:f}}; } return {stringValue:String(v)}; }
function fsParse(v){ if(!v||typeof v!=='object') return null; if('nullValue' in v) return null; if('booleanValue' in v) return !!v.booleanValue;
  if('integerValue' in v) return Number(v.integerValue); if('doubleValue' in v) return Number(v.doubleValue); if('stringValue' in v) return v.stringValue; if('timestampValue' in v) return v.timestampValue;
  if('arrayValue' in v) return ((v.arrayValue&&v.arrayValue.values)||[]).map(fsParse);
  if('mapValue' in v){ const o={}, f=(v.mapValue&&v.mapValue.fields)||{}; Object.keys(f).forEach(k=>o[k]=fsParse(f[k])); return o; } return null; }
const restBase=()=>'https://firestore.googleapis.com/v1/projects/'+(syncCfg()||{}).projectId+'/databases/(default)/documents';
async function restFetch(url,opt,ms,oque){ const u=SYNC.auth&&SYNC.auth.currentUser; if(!u) throw new Error('Sessão não autenticada.'); const tk=await u.getIdToken();
  const o=Object.assign({},opt||{}); o.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+tk},o.headers||{});
  const r=await comPrazo(fetch(url,o),ms||20000,'tempo esgotado '+(oque||''));
  if(!r.ok){ let m=''; try{ const j=await r.json(); m=(j.error&&(j.error.status+': '+j.error.message))||''; }catch(e){} throw new Error('HTTP '+r.status+(m?' — '+m:'')); }
  return r.status===204?null:r.json(); }
async function restGravar(docid,body){ await restFetch(restBase()+'/'+COL+'/'+encodeURIComponent(docid),{method:'PATCH',body:JSON.stringify({fields:fsVal(JSON.parse(JSON.stringify(body))).mapValue.fields})},20000,'ao gravar '+docid); }
async function restApagar(docid){ try{ await restFetch(restBase()+'/'+COL+'/'+encodeURIComponent(docid),{method:'DELETE'},15000,'ao apagar'); }catch(e){} }
async function gravarDoc(docid,body){
  if(SYNC.viaRest) return restGravar(docid,body);
  try{ await comPrazo(SYNC.fs.setDoc(SYNC.fs.doc(SYNC.col,docid),body),12000,'tempo esgotado ao gravar '+docid); }
  catch(e){ if(ehCota(e)) throw e; await restGravar(docid,body); if(!SYNC.viaRest){ ligarViaRest(true); toast('A gravação normal não passou nesta rede. O painel mudou para a via direta.'); } }
}

/* ---------- ligar a sincronização ---------- */
async function iniciarSync(mostrarErro){
  if(!nuvem()){ statusSync(); return false; }
  try{
    await prepararFirebase(); const {fs}=SYNC.mod;
    if(!SYNC.auth.currentUser) throw new Error('Entre com o seu login para sincronizar.');
    SYNC.fs=fs; SYNC.db=SYNC.db||fs.getFirestore(SYNC.dbApp); SYNC.col=fs.collection(SYNC.db,COL);
    const snap=await comPrazo(fs.getDocs(SYNC.col),20000,'A leitura do banco demorou demais. Verifique a internet ou a liberação da rede do TJES.');
    const linhas=[]; snap.forEach(d=>linhas.push({id:d.id,data:(d.data()||{}).d}));
    SYNC.on=true; SYNC.erro=''; SYNC.viaRest=viaRestLigada(); SYNC.ultimaLeitura=new Date().toISOString();
    /* navegador "de fábrica" e banco com dados: o banco manda (não ressuscita o que outros apagaram) */
    if(LOCAL_NOVO&&linhas.some(l=>l.id.startsWith('r_')&&l.data)){ DB.registros=[]; DB.chat=[]; DB.lixeira=[]; }
    aplicarLinhas(linhas,true);
    if(SYNC.unsub) SYNC.unsub();
    SYNC.unsub=fs.onSnapshot(SYNC.col,s=>{ const rows=[]; s.docChanges().forEach(ch=>rows.push({id:ch.doc.id,data:ch.type==='removed'?null:(ch.doc.data()||{}).d})); if(rows.length) aplicarLinhas(rows); },
      e=>{ SYNC.erro=msgFB(e); statusSync(); });
    agendarPush(); statusSync(); return true;
  }catch(e){ SYNC.on=false; SYNC.erro=msgFB(e); anotarErro(SYNC.erro); statusSync(); if(mostrarErro) toast('Não foi possível sincronizar: '+SYNC.erro); return false; }
}
const docId=id=>id.replace(/[/\\.#$\[\]]/g,'_');
let ULT_TECLA=0; document.addEventListener('keydown',()=>{ ULT_TECLA=Date.now(); },true); document.addEventListener('input',()=>{ ULT_TECLA=Date.now(); },true);
const digitando=()=>{ const a=document.activeElement; return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&(Date.now()-ULT_TECLA)<3000); };
let ROWS_PEND=null, rowsT=null;
function aplicarLinhas(rows,inicial){
  if(!inicial&&digitando()){ ROWS_PEND=(ROWS_PEND||[]).concat(rows); clearTimeout(rowsT); rowsT=setTimeout(()=>{ const r=ROWS_PEND; ROWS_PEND=null; if(r&&r.length) aplicarLinhas(r); },1200); return; }
  SYNC.aplicando=true; let mudou=false; const novasMsgs=[];
  rows.forEach(row=>{ const id=row.id, d=row.data, s=d?JSON.stringify(d):null;
    if(d&&SB[id]===s) return; if(PEND.has(id)) return;
    if(id==='config'&&d){ DB.config=d; SB[id]=s; mudou=true; }
    else if(id==='agenda'&&d){ DB.dias=d.dias||{}; DB.ordemManual=d.ordemManual||{}; SB[id]=s; mudou=true; }
    else if(id==='acl'&&d){ DB.acl=d; SB[id]=s; mudou=true; }
    else if(id==='autorizados'){ SB[id]=s; }
    else if(id==='excluidos'&&d){ const it=d.itens||{}; Object.keys(it).forEach(k=>{ if(!DB.excluidos[k]||it[k]>DB.excluidos[k]) DB.excluidos[k]=it[k]; });
      Object.keys(DB.excluidos).forEach(rid=>{ const i=DB.registros.findIndex(x=>x.id===rid); if(i>=0){ const r=DB.registros[i]; if(!DB.lixeira.some(x=>x&&x.r&&x.r.id===rid)) DB.lixeira.push({r,em:DB.excluidos[rid],por:'(outro computador)'}); DB.registros.splice(i,1); mudou=true; } }); SB[id]=s; }
    else if(id.startsWith('lixeira_')&&d){ const ids=new Set(DB.lixeira.map(x=>x&&x.r&&x.r.id)); (d.itens||[]).forEach(x=>{ if(x&&x.r&&!ids.has(x.r.id)&&!DB.registros.some(r=>r.id===x.r.id)){ DB.lixeira.push(x); mudou=true; } }); SB[id]=s; }
    else if(id.startsWith('r_')){ const rid=id.slice(2), i=DB.registros.findIndex(x=>x.id===rid);
      if(!d){ if(i>=0){ DB.registros.splice(i,1); mudou=true; } delete SB[id]; }
      else if(DB.excluidos[rid]){ delete SB[id]; if(i>=0){ DB.registros.splice(i,1); mudou=true; } setTimeout(agendarPush,200); }
      else { if(i>=0) DB.registros[i]=d; else DB.registros.push(d); SB[id]=s; mudou=true; } }
    else if(id.startsWith('chat_')){ const cid=id.slice(5);
      if(!d){ const i=DB.chat.findIndex(m=>m.id===cid); if(i>=0){ DB.chat.splice(i,1); mudou=true; } delete SB[id]; }
      else { if(!DB.chat.some(m=>m.id===d.id)){ DB.chat.push(d); DB.chat.sort((a,b)=>a.ts.localeCompare(b.ts)); mudou=true; if(!inicial&&d.autor!==EU) novasMsgs.push(d); } SB[id]=s; } }
    else if(id.startsWith('log_')&&d){ const ids=new Set(DB.log.map(e=>e.ts+e.usr+e.acao)); (d.itens||[]).forEach(e=>{ if(!ids.has(e.ts+e.usr+e.acao)){ DB.log.push(e); mudou=true; } }); DB.log.sort((a,b)=>a.ts.localeCompare(b.ts)); SB[id]=s; }
  });
  if(mudou){ DB=migrar(DB); DB.acl=DB.acl||{logins:[]}; DB.chat=DB.chat||[]; DB.excluidos=DB.excluidos||{};
    DB.registros.forEach(r=>{ if(r.H==null||r.nivel==null) recalcular(r); }); acl().logins.forEach(a=>garantirPessoa(a.u));
    try{ localStorage.setItem(CHAVE,JSON.stringify(DB)); }catch(e){}
    if(typeof estadoAtual==='function') estadoBase=estadoAtual();
    if(LOGADO){ renderTudo(); if(drId&&byId(drId)&&!inicial&&!digitando()) renderDrawer(byId(drId)); if(chatAberto) renderChat(); renderChatBadge(); }
    if(novasMsgs.length&&LOGADO){ const m=novasMsgs[novasMsgs.length-1]; if(!chatAberto||chatCanal!==m.canal){ if(m.canal==='geral'||m.canal.includes(EU)) toastMsg(m); } }
  }
  SYNC.aplicando=false;
}
let pushT=null, pushPend=false, ultimoPush=0, ultimoLog=0;
function agendarPush(){ if(!SYNC.on||SYNC.aplicando) return; clearTimeout(pushT);
  const espera=digitando()?4000:Math.max(1500,4000-(Date.now()-ultimoPush)); pushT=setTimeout(()=>{ if(digitando()){ agendarPush(); return; } empurrar(); },espera); statusSync(true); }
async function empurrar(){
  if(!SYNC.on||pushPend) return; pushPend=true; ultimoPush=Date.now(); const fs=SYNC.fs;
  try{
    const ops=[], del=[], grandes=[];
    const põe=(id,data)=>{ const s=JSON.stringify(data); if(s.length>700000){ grandes.push(id); return; } if(SB[id]===s) return; SB[id]=s; PEND.add(id); ops.push([id,docId(id),{d:data,por:EU,em:new Date().toISOString()}]); };
    DB.registros.forEach(r=>{ if(DB.excluidos[r.id]) return; põe('r_'+r.id,r); });
    Object.keys(SB).forEach(id=>{ if(id.startsWith('r_')&&!byId(id.slice(2))){ const rid=id.slice(2); if(!DB.excluidos[rid]) DB.excluidos[rid]=new Date().toISOString(); delete SB[id]; del.push(docId(id)); } });
    põe('excluidos',{itens:DB.excluidos});
    põe('config',DB.config); põe('agenda',{dias:DB.dias,ordemManual:DB.ordemManual}); põe('acl',DB.acl);
    põe('autorizados',{emails:acl().logins.map(a=>emailDe(a.u))});
    { const lx=(DB.lixeira||[]).slice(-60); for(let i=0;i<Math.max(1,Math.ceil(lx.length/15));i++) põe('lixeira_'+String(i).padStart(2,'0'),{itens:lx.slice(i*15,i*15+15)}); }
    DB.chat.slice(-400).forEach(m=>põe('chat_'+m.id,m));
    Object.keys(SB).forEach(id=>{ if(id.startsWith('chat_')&&!DB.chat.some(m=>m.id===id.slice(5))){ delete SB[id]; del.push(docId(id)); } });
    const mandaLog=ops.length>0||(Date.now()-ultimoLog)>600000;
    if(mandaLog){ ultimoLog=Date.now(); const porMes={}; DB.log.forEach(e=>{ const k='log_'+e.ts.slice(0,7); (porMes[k]=porMes[k]||[]).push(e); });
      Object.keys(porMes).sort().slice(-2).forEach(k=>{ const arr=porMes[k]; for(let i=0;i<arr.length;i+=150) põe(k+'_'+String(i/150).padStart(3,'0'),{itens:arr.slice(i,i+150)}); }); }
    salvarPend();
    for(let i=0;i<ops.length;i+=10){ const lote=ops.slice(i,i+10); let feito=false;
      if(!SYNC.viaRest&&fs.writeBatch){ try{ const b=fs.writeBatch(SYNC.db); lote.forEach(([,docid,body])=>b.set(fs.doc(SYNC.col,docid),body)); await comPrazo(b.commit(),18000,'tempo esgotado no lote'); feito=true; contarGrav(lote.length); lote.forEach(([id])=>PEND.delete(id)); salvarPend(); }catch(err){ if(ehCota(err)) throw err; } }
      if(!feito){ let ult=null, passou=0; for(const [id,docid,body] of lote){ try{ await gravarDoc(docid,body); contarGrav(1); PEND.delete(id); passou++; }catch(e2){ ult=e2; delete SB[id]; } } salvarPend(); if(passou<lote.length) throw ult||new Error('falha ao gravar'); }
    }
    for(const id of del){ if(SYNC.viaRest) await restApagar(id); else { try{ await comPrazo(fs.deleteDoc(fs.doc(SYNC.col,id)),15000,'tempo esgotado ao apagar'); }catch(e){ await restApagar(id); } } }
    if(ops.length){ ULT_OK=new Date().toISOString(); try{ localStorage.setItem('pauta-ult-envio',ULT_OK); }catch(e){} }
    SYNC.erro=''; SYNC.erroPush=grandes.length?'Documento grande demais para o banco: '+grandes.join(', '):'';
  }catch(e){ SYNC.erroPush=ehCota(e)?'A cota diária gratuita do Firebase acabou; as alterações ficam na fila e sobem sozinhas quando ela zerar.':msgFB(e); anotarErro(SYNC.erroPush);
    clearTimeout(pushT); pushT=setTimeout(()=>{ if(SYNC.on) empurrar(); },ehCota(e)?600000:30000); }
  finally{ pushPend=false; statusSync(); }
}

/* ---------- indicador ---------- */
function statusSync(enviando){
  const el=document.getElementById('syncInd'); if(!el) return;
  let cls='', txt='', tit='';
  if(!nuvem()){ cls='loc'; txt='Só neste computador'; tit='Clique para ligar o painel ao banco online da equipe'; }
  else if(!SYNC.on){ cls='err'; txt='Sem sincronizar'; tit=SYNC.erro||'Sem conexão com o banco online'; }
  else if(SYNC.erroPush){ cls='err'; txt=`${PEND.size} a enviar`; tit=SYNC.erroPush; }
  else if(pushPend||enviando||PEND.size){ cls='run'; txt='Sincronizando…'; tit='Enviando as alterações para o banco online'; }
  else { cls='ok'; txt='Sincronizado'+(SYNC.viaRest?' (via direta)':''); tit='Tudo salvo no banco online'+(ULT_OK?' · último envio '+new Date(ULT_OK).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''); }
  el.className='syncind '+cls; el.title=tit; el.innerHTML=`<i></i>${esc(txt)}`;
  el.onclick=()=>abrirCfg('sync');
  const bar=document.getElementById('syncBar'); if(bar){
    bar.innerHTML=(nuvem()&&SYNC.on&&SYNC.erroPush)?`<div class="bkbar crit"><b>${PEND.size} alteração(ões) ainda não foram para o banco online.</b> ${esc(SYNC.erroPush)} <span class="cnt">Elas ficam guardadas neste computador e o painel tenta de novo sozinho.</span> <button class="btn sm pri" id="syRe">Tentar agora</button></div>`
      :(nuvem()&&LOGADO&&!SYNC.on&&SYNC.erro)?`<div class="bkbar crit"><b>Sem conexão com o banco online.</b> ${esc(SYNC.erro)} <span class="cnt">Você continua trabalhando; o que fizer fica neste computador e sobe quando a conexão voltar.</span> <button class="btn sm pri" id="syRe2">Reconectar</button></div>`:'';
    const a=bar.querySelector('#syRe'); if(a) a.onclick=()=>{ empurrar(); toast('Enviando…'); };
    const b=bar.querySelector('#syRe2'); if(b) b.onclick=()=>iniciarSync(true);
  }
}

async function entrar(u,senha){
  u=norm(u).toLowerCase().replace(/\s+/g,''); if(!u) return telaLogin('Informe o login.');
  if(nuvem()){
    try{ await comPrazo(loginFirebase(u,senha),20000,'O Firebase não respondeu a tempo. Verifique a internet ou a liberação da rede do TJES.'); }catch(e){ return telaLogin(msgFB(e),u); }
    const ok=await iniciarSync();
    const a=aclUser(u);
    if(!a){ await sairFirebase(); return telaLogin(ok?'O seu login não está autorizado neste painel. Peça ao administrador para incluir você em Ajustes → Usuários e acesso.':'Entrou, mas não consegui ler o banco online: '+SYNC.erro,u); }
    return entrar2(a.u,ok);
  }
  const a=aclUser(u); if(!a) return telaLogin('Login não autorizado neste painel. Peça ao administrador para incluir você em Ajustes → Usuários e acesso.',u);
  if(!a.senhaHash){ if(!senha||senha.length<4) return telaLogin('Primeiro acesso deste login neste computador: escolha uma senha de pelo menos 4 caracteres.',u); a.senhaHash=await sha(senha); salvar(); toast('Senha definida.'); }
  else if(await sha(senha||'')!==a.senhaHash) return telaLogin('Senha incorreta.',u);
  entrar2(a.u,false);
}

function regrasFirestore(){
  const adm=emailDe((acl().logins.find(x=>x.perfil==='admin')||acl().logins[0]||{u:'klpizzol'}).u);
  return `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    // Painel de Réus Presos (coleção "painel") — mantido como estava
    function listaPainel() {
      return exists(/databases/$(database)/documents/painel/autorizados)
        ? get(/databases/$(database)/documents/painel/autorizados).data.d.emails
        : ['${adm}'];
    }
    match /painel/{doc} {
      allow read, write: if request.auth != null
        && (request.auth.token.email == '${adm}' || request.auth.token.email in listaPainel());
    }

    // Gestão de Pauta de Audiências (coleção "pauta")
    function listaPauta() {
      return exists(/databases/$(database)/documents/pauta/autorizados)
        ? get(/databases/$(database)/documents/pauta/autorizados).data.d.emails
        : ['${adm}'];
    }
    match /pauta/{doc} {
      allow read, write: if request.auth != null
        && (request.auth.token.email == '${adm}' || request.auth.token.email in listaPauta());
    }
  }
}`;
}

async function acaoCfgSync(k,b,box){
  if(k==='aladd'){ if(!souAdmin()) return true; const u=norm(box.querySelector('#alU').value).toLowerCase().replace(/\s+/g,''), n=box.querySelector('#alN').value.trim(), p=box.querySelector('#alP').value;
    if(!/^[a-z0-9._-]{2,}$/.test(u)) { toast('Login inválido: use letras, números, ponto ou hífen.'); return true; } if(aclUser(u)){ toast('Este login já está autorizado.'); return true; }
    acl().logins.push({u,nome:n||u,perfil:p,por:EU,em:hojeISO()}); garantirPessoa(u); salvar(); if(SYNC.on) await empurrar();
    if(nuvem()) await criarContaUI(u,n||u); else abrirCfg('acesso'); return true; }
  if(k==='alconta'){ await criarContaUI(b.dataset.u,(aclUser(b.dataset.u)||{}).nome); return true; }
  if(k==='aldel'){ const i=+b.closest('[data-al]').dataset.al, a=acl().logins[i]; if(!a||a.u===EU) return true; if(await confirmar('Remover o acesso?',`${esc(a.nome||a.u)} (${esc(a.u)}) não conseguirá mais entrar nesta pauta.`,'Remover',true)){ acl().logins.splice(i,1); salvar(); } abrirCfg('acesso'); return true; }
  if(k==='alsenha'){ const a=acl().logins[+b.closest('[data-al]').dataset.al]; delete a.senhaHash; salvar(); toast('Senha zerada: a pessoa define outra no próximo acesso.'); abrirCfg('acesso'); return true; }
  if(k==='syok'){ const c=lerConfigFirebase(box.querySelector('#fbCfg').value); if(!c){ toast('Não reconheci a configuração do Firebase.'); return true; }
    c.dominio=box.querySelector('#fbDom').value.trim()||DOM_PADRAO; if(!box.querySelector('#fbLp').checked) c.longPolling=false; setSyncCfg(c); toast('Configuração salva. Recarregando…'); try{ localStorage.removeItem(SESS_KEY); }catch(e){} setTimeout(()=>location.reload(),600); return true; }
  if(k==='sycopy'){ copiarTexto(JSON.stringify(Object.assign({},syncCfg()||{},{manual:undefined}),null,1),'Configuração copiada.'); return true; }
  if(k==='sydesc'){ if(await confirmar('Desconectar do banco online?','Este computador volta a guardar os dados só localmente. Nada é apagado do banco.','Desconectar',true)){ await sairFirebase(); setSyncCfg(null); try{ localStorage.setItem(SYNC_KEY,JSON.stringify({manual:true})); }catch(e){} location.reload(); } return true; }
  if(k==='syregras'){ copiarTexto(regrasFirestore(),'Regras copiadas.'); return true; }
  if(k==='syre'){ (SYNC.on?empurrar():iniciarSync(true)).then(()=>abrirCfg('sync')); return true; }
  if(k==='syrest'){ ligarViaRest(!viaRestLigada()); abrirCfg('sync'); return true; }
  return false;
}

    (outros.length?outros.map(p=>{ const c=canalDM(EU,p.id); return `<button data-c="${c}" class="${chatCanal===c?'on':''}">${avatarHTML(p.id,1)} ${esc(p.apelido||p.nome)}${un(c)}</button>`; }).join(''):'<div class="cnt" style="padding:4px 8px;white-space:normal">Ainda não há outras pessoas com acesso. Libere em Ajustes → Usuários e acesso.</div>');
  const msgs=DB.chat.filter(m=>m.canal===chatCanal), el=document.getElementById('chMsgs');
  el.innerHTML=msgs.length?msgs.map(m=>{ const d=new Date(m.ts); return `<div class="msg ${m.autor===EU?'meu':''} ${(m.menc||[]).includes(EU)?'cita':''}">${avatarHTML(m.autor)}<div><div class="hd"><b>${esc(nomeP(m.autor))}</b> · ${d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})} ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div><div class="bub">${fmtMsg(m.texto)}</div></div>${m.autor===EU?`<button class="delmsg" data-del="${m.id}" title="Apagar mensagem">${ico('lixo',12)}</button>`:''}</div>`; }).join('')
    :`<div class="empty">Nenhuma mensagem ${chatCanal==='geral'?'no canal geral':'nesta conversa'} ainda.<br><span class="cnt">Dica: cite pessoas com @ e cole o nº do processo para criar um link.</span></div>`;
  el.scrollTop=el.scrollHeight;
  CHAT_LIDO[EU]=CHAT_LIDO[EU]||{}; const ult=msgs.length?msgs[msgs.length-1].ts:''; if(ult&&ult>(CHAT_LIDO[EU][chatCanal]||'')){ CHAT_LIDO[EU][chatCanal]=ult; try{ localStorage.setItem('pauta-chat-lido',JSON.stringify(CHAT_LIDO)); }catch(e){} }
  renderChatBadge();
  document.getElementById('chTxt').placeholder=chatCanal==='geral'?'Mensagem para todos… (@ cita, Enter envia)':`Mensagem para ${nomeP(chatCanal.slice(3).split('|').find(x=>x!==EU))}…`;
  document.getElementById('chSub').textContent=nuvem()?(SYNC.on?'As mensagens aparecem para a equipe em segundos.':'Sem conexão: as mensagens sobem quando a conexão voltar.'):'Sem banco online: as mensagens ficam só neste computador.';
}
function enviarMsg(){ const ta=document.getElementById('chTxt'), t=ta.value.trim(); if(!t) return;
  DB.chat.push({id:uid(),canal:chatCanal,autor:EU,texto:t,ts:new Date().toISOString(),menc:parseMenc(t)}); if(DB.chat.length>3000) DB.chat.splice(0,DB.chat.length-3000);
  ta.value=''; fecharSugChat(); DB.salvoEm=new Date().toISOString(); gravar(); renderChat(); if(SYNC.on){ clearTimeout(pushT); empurrar(); } }
function apagarMsg(id){ const i=DB.chat.findIndex(m=>m.id===id&&m.autor===EU); if(i<0) return; DB.chat.splice(i,1); gravar(); renderChat(); }
function toastMsg(m){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const t=document.createElement('div'); t.className='toast';
  t.innerHTML=`<span><b>${esc(nomeP(m.autor))}</b>${m.canal==='geral'?' (geral)':''}: ${esc(trunc(m.texto,80))}</span><button>Abrir chat</button>`; t.querySelector('button').onclick=()=>{ t.remove(); chatCanal=m.canal; abrirChat(); };
  document.body.appendChild(t); setTimeout(()=>t.remove(),8000); }
let sugSel=0; const fecharSugChat=()=>document.getElementById('chSug').classList.remove('on');
document.getElementById('fabChat').innerHTML=ico('msg',17)+' Chat<span class="badge" id="chatBadge"></span>';
document.getElementById('fabChat').onclick=()=>chatAberto?fecharChat():abrirChat();
document.getElementById('chClose').innerHTML=ico('x',14); document.getElementById('chClose').onclick=fecharChat;
document.getElementById('chSend').innerHTML=ico('dir',16);
document.getElementById('chSend').onclick=enviarMsg;
document.getElementById('chList').onclick=e=>{ const b=e.target.closest('[data-c]'); if(!b) return; chatCanal=b.dataset.c; renderChat(); document.getElementById('chTxt').focus(); };
document.getElementById('chMsgs').onclick=e=>{ const dl=e.target.closest('[data-del]'); if(dl){ apagarMsg(dl.dataset.del); return; }
  const b=e.target.closest('[data-procnum]'); if(!b) return; const r=DB.registros.find(x=>(x.proc||'').includes(b.dataset.procnum)); if(r) abrirDrawer(r.id); else toast('Processo não encontrado na pauta.'); };
const chTxt=document.getElementById('chTxt');
chTxt.addEventListener('keydown',e=>{ const sg=document.getElementById('chSug');
  if(sg.classList.contains('on')){ const bs=[...sg.querySelectorAll('button')];
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); sugSel=(sugSel+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length; bs.forEach((b,i)=>b.classList.toggle('sel',i===sugSel)); return; }
    if(e.key==='Enter'||e.key==='Tab'){ e.preventDefault(); bs[sugSel]&&bs[sugSel].click(); return; } if(e.key==='Escape'){ fecharSugChat(); return; } }
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); enviarMsg(); } });
chTxt.addEventListener('input',()=>{ const pre=chTxt.value.slice(0,chTxt.selectionStart), m=pre.match(/@([\wÀ-ÿ.\-]*)$/), sg=document.getElementById('chSug');
  if(!m){ fecharSugChat(); return; } const q=norm(m[1]); const l=equipeChat().filter(p=>!q||norm(p.id).startsWith(q)||norm(p.apelido||'').startsWith(q)||norm(p.nome).includes(q));
  if(!l.length){ fecharSugChat(); return; } sugSel=0;
  sg.innerHTML=l.map((p,i)=>`<button data-p="${p.id}" class="${i===0?'sel':''}">${avatarHTML(p.id,1)} ${esc(p.nome)} <span class="cnt">@${esc(p.id)}</span></button>`).join(''); sg.classList.add('on'); });
document.getElementById('chSug').onclick=e=>{ const b=e.target.closest('[data-p]'); if(!b) return; const p=pessoaEq(b.dataset.p), pos=chTxt.selectionStart, pre=chTxt.value.slice(0,pos).replace(/@([\wÀ-ÿ.\-]*)$/,'@'+(p.apelido||p.id)+' ');
  chTxt.value=pre+chTxt.value.slice(pos); chTxt.focus(); chTxt.setSelectionRange(pre.length,pre.length); fecharSugChat(); };

/* ---------- partida: tela de login ou sessão salva ---------- */
(async()=>{
  statusSync();
  let sess=''; try{ sess=localStorage.getItem(SESS_KEY)||''; }catch(e){}
  if(nuvem()){
    document.getElementById('lock').innerHTML=`<div class="lockbox"><img src="${document.getElementById('logoCor').src}" alt="TJES" style="height:46px"><div class="cnt" style="margin-top:12px">Conectando ao banco online…</div></div>`;
    try{ await comPrazo(prepararFirebase(),15000,'tempo'); const u=await esperarAuth();
      if(u&&sess&&u.email===emailDe(sess)){ const ok=await iniciarSync(); if(aclUser(sess)) return entrar2(sess,ok); await sairFirebase(); return telaLogin('O seu login não está autorizado neste painel.',sess); } }
    catch(e){ SYNC.erro=msgFB(e); }
    return telaLogin(SYNC.erro&&!SYNC.auth?SYNC.erro:'',sess);
  }
  if(sess&&aclUser(sess)&&sessionStorage.getItem('pauta-sess-aba')===sess) return entrar2(sess,false);
  telaLogin('',sess);
})();

</script></body></html>
